# Keeps the free-tier Supabase project from auto-pausing after 7 days without activity.
# Makes a tiny read request twice a week using the PUBLIC (publishable) key already in index.html.
# No secrets required. Disable this workflow if you move to a paid Supabase plan.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 15 * * 1,4"   # Mon & Thu 15:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPA_URL: https://cregneohqyqnllcylaof.supabase.co
          SUPA_KEY: sb_publishable_8VsxLgCQQ5yWnEK1g37s6Q_6mLFr-FB
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPA_URL/rest/v1/training_confirmations?select=id&limit=1" \
            -H "apikey: $SUPA_KEY" -H "Authorization: Bearer $SUPA_KEY")
          echo "Supabase responded HTTP $code"
          # 200 = ok (empty result is expected for anonymous callers under RLS)
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then exit 1; fi
