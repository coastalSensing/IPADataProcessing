<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPA MIP Classifier Portal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap');
:root{
  --bg:#f0f4f8;--panel:#ffffff;--panel2:#f5f8fb;--border:#dde4ed;--border2:#c8d4e0;
  --accent:#0071b8;--accent2:#005a8e;--pos:#1a8c4e;--neg:#cc2233;--warn:#b07800;
  --mixed:#5a50c8;--art:#c05000;--hydro:#0080b0;--metal:#b02040;
  --text:#1a2533;--dim:#8099b0;--dim2:#607a90;--dim3:#3a5570;
  --font-mono:'Space Mono',monospace;--font-ui:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:13px;}
body{overflow:hidden;}
.app{display:grid;grid-template-rows:52px 1fr;height:100vh;}
.topbar{background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;z-index:100;}
.topbar h1{font-family:var(--font-mono);font-size:13px;color:var(--accent);letter-spacing:.08em;white-space:nowrap;}
.sep{width:1px;height:20px;background:var(--border2);}
.main{display:grid;grid-template-columns:260px 1fr 320px;overflow:hidden;}
.sidebar{background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;}
.content{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
.ai-panel{background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}

/* Sidebar */
.upload-zone{border:1px dashed var(--border2);border-radius:4px;padding:16px 12px;text-align:center;cursor:pointer;transition:border-color .2s;}
.upload-zone:hover,.upload-zone.drag{border-color:var(--accent);}
.upload-zone .icon{font-size:20px;margin-bottom:6px;}
.upload-zone p{font-size:11px;color:var(--dim2);line-height:1.5;}
.upload-zone span{color:var(--accent);}
.file-item{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:3px;cursor:pointer;border:1px solid transparent;transition:all .15s;}
.file-item:hover{background:var(--panel2);}
.file-item.active{background:var(--panel2);border-color:var(--border2);}
.file-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.file-name{font-size:11px;color:var(--dim3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.file-info{font-size:9px;color:var(--dim);font-family:var(--font-mono);}
.sidebar-label{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);padding:0 2px;}
.btn{padding:7px 14px;border-radius:3px;border:none;cursor:pointer;font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;transition:all .15s;white-space:nowrap;}
.btn-primary{background:var(--accent);color:#000;font-weight:700;}
.btn-primary:hover{background:#00a8c8;color:#000;}
.btn-primary:disabled{opacity:.4;cursor:default;}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--dim3);}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-sm{padding:4px 10px;font-size:10px;}
.btn-ai{background:linear-gradient(135deg,#0071b8,#00a8d0);color:#fff;font-weight:700;border:none;}
.btn-ai:hover{opacity:.9;}
.btn-ai:disabled{opacity:.35;cursor:default;}

/* Stats */
.statsbar{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:3px;padding:9px 11px;}
.stat label{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim2);display:block;margin-bottom:3px;}
.stat .val{font-family:var(--font-mono);font-size:15px;font-weight:700;color:var(--accent);}
.stat .sub{font-family:var(--font-mono);font-size:9px;color:var(--dim);margin-top:2px;}

/* Charts */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.chart-panel{background:var(--panel);border:1px solid var(--border);border-radius:3px;padding:10px 12px;}
.chart-panel.full{grid-column:1/-1;}
.chart-title{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim2);margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;}
canvas{display:block;width:100%;}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:5px;}
.li{display:flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:9px;color:var(--dim2);}
.ld{width:14px;height:2px;border-radius:1px;}

/* Events table */
.events-wrap{overflow-x:auto;}
.events-table{width:100%;border-collapse:collapse;min-width:700px;}
.events-table th{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim2);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border2);white-space:nowrap;}
.events-table td{padding:6px 8px;border-bottom:1px solid var(--border);font-family:var(--font-mono);font-size:11px;vertical-align:middle;}
.events-table tr:hover td{background:var(--panel2);}
.events-table tr.selected td{background:var(--panel2);border-bottom-color:var(--border2);}
.badge{display:inline-block;padding:2px 7px;border-radius:2px;font-size:10px;font-weight:700;font-family:var(--font-mono);}
.badge-hydro{background:rgba(0,113,184,.10);color:var(--hydro);}
.badge-metal{background:rgba(176,32,64,.10);color:var(--metal);}
.badge-mixed{background:rgba(90,80,200,.10);color:var(--mixed);}
.badge-art{background:rgba(192,80,0,.10);color:var(--art);}
.badge-weak{background:rgba(80,100,130,.10);color:var(--dim3);}
.conf-bar{display:flex;align-items:center;gap:5px;}
.conf-fill{height:4px;border-radius:2px;min-width:2px;}
.conf-text{font-size:9px;color:var(--dim2);white-space:nowrap;}

/* AI Panel */
.ai-section-title{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim2);}
.api-key-row{display:flex;gap:6px;}
.api-key-input{flex:1;background:var(--panel2);border:1px solid var(--border2);color:var(--text);font-family:var(--font-mono);font-size:11px;padding:6px 9px;border-radius:3px;}
.api-key-input:focus{outline:none;border-color:var(--accent);}
.ai-response{background:var(--panel2);border:1px solid var(--border2);border-radius:3px;padding:10px 12px;flex:1;min-height:120px;}
.ai-response p{font-size:12px;color:var(--dim3);line-height:1.7;white-space:pre-wrap;}
.ai-response .thinking{color:var(--dim);font-style:italic;font-size:11px;}
.ai-classification{background:var(--panel2);border:1px solid var(--border2);border-radius:3px;padding:10px 12px;}
.ai-cls-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.ai-cls-label{font-size:10px;color:var(--dim2);font-family:var(--font-mono);}
.ai-cls-val{font-size:14px;font-weight:600;font-family:var(--font-mono);}
.ai-conf-val{font-family:var(--font-mono);font-size:12px;color:var(--dim3);}
.training-entry{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:2px;background:var(--panel2);font-size:10px;font-family:var(--font-mono);}
.training-entry .mat{font-weight:700;}
.training-list{display:flex;flex-direction:column;gap:3px;max-height:160px;overflow-y:auto;}
.confirm-row{display:flex;gap:6px;align-items:center;}
.confirm-sel{flex:1;background:var(--panel2);border:1px solid var(--border2);color:var(--text);font-family:var(--font-mono);font-size:10px;padding:5px 8px;border-radius:3px;}
.confirm-sel:focus{outline:none;border-color:var(--pos);}
.confirm-btn{background:#1a8c4e;color:#000;border:none;padding:5px 10px;border-radius:3px;font-family:var(--font-mono);font-size:10px;cursor:pointer;font-weight:700;white-space:nowrap;}
.confirm-btn:hover{opacity:.85;}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:280px;color:var(--dim);gap:10px;}
.empty .icon{font-size:32px;opacity:.3;}
.empty p{font-family:var(--font-mono);font-size:11px;text-align:center;line-height:1.7;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:#c0ccd8;border-radius:2px;}
::-webkit-scrollbar-thumb:hover{background:var(--dim);}

/* ── Collections ── */
.coll-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.coll-list{display:flex;flex-direction:column;gap:3px;}
.coll-item{border:1px solid var(--border);border-radius:3px;overflow:hidden;}
.coll-item.active-coll{border-color:var(--accent);}
.coll-title-row{display:flex;align-items:center;gap:6px;padding:6px 8px;cursor:pointer;background:var(--panel2);transition:background .15s;}
.coll-title-row:hover{background:var(--border);}
.coll-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.coll-name{font-size:11px;font-weight:600;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.coll-meta{font-size:9px;color:var(--dim2);font-family:var(--font-mono);white-space:nowrap;}
.coll-files{padding:4px 8px 6px 24px;display:flex;flex-direction:column;gap:2px;background:var(--panel);}
.coll-file-row{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:2px;cursor:pointer;font-size:10px;font-family:var(--font-mono);color:var(--dim3);}
.coll-file-row:hover{background:var(--panel2);color:var(--text);}
.coll-file-row.active{color:var(--accent);font-weight:700;}
.coll-mat-pill{display:inline-block;padding:1px 5px;border-radius:10px;font-size:9px;font-family:var(--font-mono);margin-left:auto;white-space:nowrap;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:999;}
.modal{background:var(--panel);border:1px solid var(--border2);border-radius:6px;padding:24px;width:400px;box-shadow:0 8px 32px rgba(0,0,0,.18);}
.modal h2{font-family:var(--font-mono);font-size:13px;color:var(--accent);margin-bottom:14px;}
.modal label{font-family:var(--font-mono);font-size:10px;color:var(--dim2);display:block;margin-bottom:4px;margin-top:10px;}
.modal input,.modal select{width:100%;background:var(--panel2);border:1px solid var(--border2);color:var(--text);font-family:var(--font-mono);font-size:12px;padding:6px 9px;border-radius:3px;}
.modal input:focus,.modal select:focus{outline:none;border-color:var(--accent);}
.modal .modal-btns{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;}
.color-swatches{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;}
.swatch{width:20px;height:20px;border-radius:3px;cursor:pointer;border:2px solid transparent;transition:border-color .15s;}
.swatch:hover,.swatch.sel{border-color:var(--text);}
.tab-row{display:flex;border-bottom:1px solid var(--border);margin-bottom:10px;}
.tab{padding:6px 14px;font-family:var(--font-mono);font-size:10px;cursor:pointer;color:var(--dim2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;text-transform:uppercase;letter-spacing:.06em;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab:hover:not(.active){color:var(--text);}
.export-box{background:var(--panel2);border:1px solid var(--border);border-radius:3px;padding:10px;font-family:var(--font-mono);font-size:10px;color:var(--dim3);white-space:pre-wrap;max-height:120px;overflow-y:auto;}

/* ── Map panel ── */
.map-panel{background:var(--panel2);border:1px solid var(--border);border-radius:3px;position:relative;overflow:hidden;}
.map-canvas{display:block;width:100%;cursor:crosshair;}
.map-legend{position:absolute;bottom:8px;left:8px;background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:3px;padding:6px 10px;font-family:var(--font-mono);font-size:9px;line-height:1.8;}
.map-controls{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px;}
.map-btn{background:rgba(255,255,255,.9);border:1px solid var(--border2);border-radius:3px;padding:4px 8px;cursor:pointer;font-size:11px;font-family:var(--font-mono);}
.map-btn:hover{background:#fff;border-color:var(--accent);}
.map-tooltip{position:absolute;background:rgba(255,255,255,.97);border:1px solid var(--border2);border-radius:3px;padding:6px 10px;font-family:var(--font-mono);font-size:10px;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.12);max-width:220px;line-height:1.6;}
/* ── Lab output table ── */
.lab-table{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:11px;}
.lab-table th{text-align:right;padding:4px 10px;border-bottom:1px solid var(--border2);font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim2);white-space:nowrap;}
.lab-table th:first-child{text-align:left;}
.lab-table td{text-align:right;padding:4px 10px;border-bottom:1px solid var(--border);color:var(--text);}
.lab-table td:first-child{text-align:left;color:var(--dim3);}
.lab-table tr:hover td{background:var(--panel2);}

/* ── Map & run organizer additions ── */
.map-wrap{position:relative;background:#e8eef4;border-radius:3px;border:1px solid var(--border);overflow:hidden;}
.leaflet-container{border-radius:3px;height:100% !important;}
.map-controls-panel{background:rgba(255,255,255,.95);border:1px solid var(--border2);border-radius:3px;padding:8px 10px;font-family:var(--font-mono);font-size:10px;display:flex;flex-direction:column;gap:6px;}
.layer-btn-group{display:flex;gap:4px;flex-wrap:wrap;}
.layer-btn{padding:3px 8px;border-radius:2px;border:1px solid var(--border2);background:var(--panel);font-family:var(--font-mono);font-size:9px;cursor:pointer;color:var(--dim3);transition:all .15s;}
.layer-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.layer-btn:hover:not(.active){border-color:var(--accent);color:var(--accent);}
.file-sel-list{display:flex;flex-direction:column;gap:3px;max-height:140px;overflow-y:auto;}
.file-sel-row{display:flex;align-items:center;gap:6px;padding:2px 4px;border-radius:2px;cursor:pointer;}
.file-sel-row:hover{background:var(--panel2);}
.file-sel-check{width:12px;height:12px;accent-color:var(--accent);}
.map-canvas{display:block;width:100%;cursor:crosshair;}
.map-tip{position:absolute;background:rgba(255,255,255,.97);border:1px solid var(--border2);border-radius:3px;
  padding:5px 9px;font-family:var(--font-mono);font-size:10px;pointer-events:none;
  box-shadow:0 2px 6px rgba(0,0,0,.12);max-width:200px;line-height:1.55;z-index:20;}
.map-toggles{display:flex;gap:6px;margin-bottom:8px;align-items:center;flex-wrap:wrap;}
.tog{padding:4px 10px;border-radius:3px;border:1px solid var(--border2);background:var(--panel);
  font-family:var(--font-mono);font-size:10px;cursor:pointer;color:var(--dim3);transition:all .15s;}
.tog.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.tog:hover:not(.on){border-color:var(--accent);color:var(--accent);}
.run-group{border:1px solid var(--border);border-radius:3px;overflow:hidden;margin-bottom:6px;}
.run-group-hdr{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel2);
  cursor:pointer;font-family:var(--font-mono);font-size:10px;}
.run-group-hdr:hover{background:var(--border);}
.run-group-name{font-weight:700;color:var(--text);flex:1;}
.run-group-body{padding:4px 6px;display:flex;flex-direction:column;gap:2px;}
.run-entry{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:2px;
  cursor:pointer;font-family:var(--font-mono);font-size:10px;color:var(--dim3);}
.run-entry:hover{background:var(--panel2);color:var(--text);}
.run-entry.active{background:var(--panel2);color:var(--accent);font-weight:700;}
.run-swatch{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.lab-tbl{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:11px;}
.lab-tbl th{text-align:right;padding:4px 10px;border-bottom:1px solid var(--border2);
  font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim2);white-space:nowrap;}
.lab-tbl th:first-child{text-align:left;}
.lab-tbl td{text-align:right;padding:4px 10px;border-bottom:1px solid var(--border);color:var(--text);}
.lab-tbl td:first-child{text-align:left;color:var(--dim3);}
.lab-tbl tr:hover td{background:var(--panel2);}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;
  align-items:center;justify-content:center;z-index:999;}
.modal{background:var(--panel);border:1px solid var(--border2);border-radius:6px;
  padding:22px;width:380px;box-shadow:0 8px 32px rgba(0,0,0,.18);}
.modal h3{font-family:var(--font-mono);font-size:12px;color:var(--accent);margin-bottom:12px;}
.modal label{font-family:var(--font-mono);font-size:10px;color:var(--dim2);display:block;
  margin-top:10px;margin-bottom:3px;}
.modal input,.modal select{width:100%;background:var(--panel2);border:1px solid var(--border2);
  color:var(--text);font-family:var(--font-mono);font-size:12px;padding:6px 8px;border-radius:3px;}
.modal input:focus,.modal select:focus{outline:none;border-color:var(--accent);}
.modal-btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}
.color-row{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap;}
.cswatch{width:20px;height:20px;border-radius:3px;cursor:pointer;border:2px solid transparent;}
.cswatch:hover,.cswatch.sel{border-color:var(--text);}

/* ── v27 additions ── */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:10px;}
.section{background:var(--panel);border:1px solid var(--border);border-radius:3px;padding:12px 14px;margin-bottom:10px;}
.section h3{font-family:var(--font-mono);font-size:11px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.note{font-size:11px;color:var(--dim3);line-height:1.6;margin-bottom:8px;}
.note b{color:var(--text);}
.warnbox{background:rgba(176,120,0,.08);border:1px solid rgba(176,120,0,.3);border-radius:3px;padding:7px 10px;font-size:11px;color:#7a5400;line-height:1.5;margin-bottom:8px;}
.mt{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:10px;}
.mt th{text-align:left;padding:4px 7px;border-bottom:1px solid var(--border2);font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim2);white-space:nowrap;}
.mt td{padding:4px 7px;border-bottom:1px solid var(--border);white-space:nowrap;}
.mt tr:hover td{background:var(--panel2);}
.mt td.num,.mt th.num{text-align:right;}
.cm td{text-align:center;min-width:34px;}
.tier{display:inline-block;padding:1px 6px;border-radius:2px;font-size:9px;font-weight:700;}
.tier-Confirmed{background:rgba(26,140,78,.14);color:var(--pos);}
.tier-Corroborated{background:rgba(0,113,184,.12);color:var(--accent);}
.tier-Conflicting{background:rgba(204,34,51,.12);color:var(--neg);}
.tier-Weak{background:rgba(80,100,130,.12);color:var(--dim3);}
.tier-Single{background:rgba(80,100,130,.08);color:var(--dim2);}
.param-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;}
.param{display:flex;flex-direction:column;gap:2px;}
.param label{font-family:var(--font-mono);font-size:9px;color:var(--dim2);}
.param input,.param select{background:var(--panel2);border:1px solid var(--border2);color:var(--text);font-family:var(--font-mono);font-size:11px;padding:4px 6px;border-radius:3px;width:100%;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.refs li{font-size:11px;color:var(--dim3);line-height:1.6;margin-left:16px;}
.pill{display:inline-block;padding:1px 6px;border-radius:10px;font-size:9px;font-family:var(--font-mono);background:var(--panel2);border:1px solid var(--border2);color:var(--dim3);}

async function classifyWithClaude(ev,harms,bg,training,apiKey,model){
  var ctx='';
  if(training.length){
    ctx='\nCONFIRMED FIELD EXAMPLES (ground truth from this team):\n'+training.slice(-25).map(function(t){
      return '- '+t.material+': dev'+harms[0]+'Hz='+(+t.fv.dp1).toFixed(2)+', dev'+harms[2]+'Hz='+(+t.fv.dp3).toFixed(2)+
        ', dev'+harms[5]+'Hz='+(+t.fv.dp_last).toFixed(2)+', mag%='+(+t.fv.magPct).toFixed(1)+', SNR='+(+t.fv.maxSNR).toFixed(1);}).join('\n');
  }
  var lab=(ev.labMatches||[]).slice(0,3).map(function(m){return '- '+m.material+': cos='+m.cos.toFixed(3)+' (angle '+m.angleDeg.toFixed(1)+'°), scale='+m.scale.toFixed(2)+', chi2red='+m.chi2red.toFixed(2);}).join('\n');
  var prompt='You are assisting a marine induced-polarization (MIP) classifier for towed-streamer IPA data. '+
    'Transmit fundamental '+harms[0]+'Hz; phase is ch1-0 delta in mrad. Deviations are relative to a running-median background; z = deviation / robust noise sigma.\n'+
    'EVENT:\n'+harms.map(function(f){var p=bg.perHz[f];return '  '+f+'Hz: raw='+(ev.dp[f]||0).toFixed(2)+' dev='+(ev.dpDev[f]||0).toFixed(2)+' z='+(p?(Math.abs(ev.dpDev[f]||0)/p.std).toFixed(1):'?');}).join('\n')+
    '\n  mag%='+(ev.magPct||0).toFixed(2)+' nPkts='+ev.nPkts+' fundSNR='+ev.maxSNR.toFixed(1)+' maxSNR='+ev.maxSNRall.toFixed(1)+
    ' phaseSlope='+(ev.phaseSlope||0).toFixed(2)+'mrad/decade\n'+
    'RULE ENGINE: '+ev.cls+' ('+ev.confPct+'%)\n'+
    (lab?'LAB REFERENCE SPECTRAL-ANGLE MATCHES (blank-subtracted, amplitude-invariant):\n'+lab+'\n':'No lab reference signatures loaded.\n')+ctx+
    '\nPHYSICS GUIDE: Hydrocarbon/organic IP = growing positive deviation toward higher harmonics with near-zero fundamental deviation (Olhoeft 1985 organic reactions; Wynn marine IP oil work). '+
    'Metallic/electronic polarisation (steel, ilmenite) = strong negative low-harmonic deviation, often with magnitude decrease (Pelton 1978 / Wong 1979 style Cole-Cole response). '+
    'Artifact = |fundamental dev|>150 mrad or magnitude drop >30% or single-packet spikes. Prefer lab-match evidence when cos>0.9 and SNR>5.\n'+
    'Allowed labels: '+CONFIRM_OPTIONS.join(', ')+'.\n'+
    'Reply with JSON only: {"classification":"<label>","confidence_pct":<0-99>,"confidence_label":"<High|Medium|Low>","key_indicators":"<1 sentence>","reasoning":"<2-3 sentences>","caution":"<or null>"}';
  var r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'content-type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:model,max_tokens:600,messages:[{role:'user',content:prompt}]})});
  if(!r.ok){var t='';try{t=(await r.json()).error.message;}catch(e){}throw new Error('API '+r.status+(t?': '+t:''));}
  var d=await r.json();
  var raw=(d.content&&d.content[0])?d.content[0].text:'';
  var m=raw.match(/\{[\s\S]*\}/);
  return JSON.parse(m?m[0]:raw);
}

// ── Canvas drawing ─────────────────────────────────────────────────────────────
function drawChart(canvas,datasets,yr,opts){
  opts=opts||{};
  if(!canvas)return;
  var W=canvas.clientWidth,H=canvas.clientHeight;if(!W||!H)return;
  canvas.width=W;canvas.height=H;
  var ctx=canvas.getContext('2d');
  var PL=48,PR=10,PT=12,PB=22,cW=W-PL-PR,cH=H-PT-PB;
  var n=datasets[0]?datasets[0].data.length:0;if(!n)return;
  var yrSpan=yr[1]-yr[0]||1;
  function xS(i){return PL+(i/(n-1||1))*cW;}
  function yS(v){return PT+cH-((Math.min(Math.max(v,yr[0]),yr[1])-yr[0])/yrSpan)*cH;}
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#dde4ed';ctx.lineWidth=0.5;
  for(var t=0;t<=4;t++){var gv=yr[0]+yrSpan*t/4,gy=yS(gv);
    ctx.beginPath();ctx.moveTo(PL,gy);ctx.lineTo(PL+cW,gy);ctx.stroke();
    ctx.fillStyle='#6080a0';ctx.font='9px monospace';ctx.textAlign='right';ctx.fillText(gv.toFixed(1),PL-3,gy+3);}
  if(opts.xLabels){ctx.fillStyle='#6080a0';ctx.font='9px monospace';ctx.textAlign='center';
    var step=Math.max(1,Math.floor(n/5));for(var xi=0;xi<n;xi+=step)ctx.fillText(opts.xLabels[xi]||'',xS(xi),H-2);}
  if(yr[0]<0&&yr[1]>0){ctx.strokeStyle='#c0ccd8';ctx.lineWidth=1;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(PL,yS(0));ctx.lineTo(PL+cW,yS(0));ctx.stroke();ctx.setLineDash([]);}
  if(opts.bgEvents){opts.bgEvents.forEach(function(ev){if(ev.i0<0)return;
    ctx.fillStyle=ev.color+(ev.sel?'44':'22');ctx.fillRect(xS(ev.i0)-2,PT,Math.max(4,xS(ev.i1)-xS(ev.i0)+4),cH);});}
  if(opts.threshLo!==undefined){ctx.strokeStyle='rgba(176,32,64,.45)';ctx.lineWidth=1;ctx.setLineDash([5,3]);
    [opts.threshLo,opts.threshHi].forEach(function(th){if(th!==undefined&&th>yr[0]&&th<yr[1]){ctx.beginPath();ctx.moveTo(PL,yS(th));ctx.lineTo(PL+cW,yS(th));ctx.stroke();}});
    ctx.setLineDash([]);}
  datasets.forEach(function(ds){
    ctx.strokeStyle=ds.color;ctx.lineWidth=ds.width||1.3;if(ds.dash)ctx.setLineDash(ds.dash);
    ctx.beginPath();var started=false;
    ds.data.forEach(function(pv,pi){if(!isFinite(pv)){started=false;return;}
      var px=xS(pi),py=yS(pv);if(started)ctx.lineTo(px,py);else{ctx.moveTo(px,py);started=true;}});
    ctx.stroke();ctx.setLineDash([]);});
  ctx.strokeStyle='#dde4ed';ctx.lineWidth=1;ctx.strokeRect(PL,PT,cW,cH);
}
function drawSpectral(canvas,series,harms,yr){
  if(!canvas)return;
  var W=canvas.clientWidth,H=canvas.clientHeight;if(!W||!H)return;
  canvas.width=W;canvas.height=H;
  var ctx=canvas.getContext('2d');
  var PL=48,PR=10,PT=12,PB=22,cW=W-PL-PR,cH=H-PT-PB,yrSpan=yr[1]-yr[0]||1;
  function xS(i){return PL+(i/(harms.length-1||1))*cW;}
  function yS(v){return PT+cH-((Math.min(Math.max(v,yr[0]),yr[1])-yr[0])/yrSpan)*cH;}
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#dde4ed';ctx.lineWidth=0.5;
  for(var t=0;t<=4;t++){var gv=yr[0]+yrSpan*t/4,gy=yS(gv);ctx.beginPath();ctx.moveTo(PL,gy);ctx.lineTo(PL+cW,gy);ctx.stroke();
    ctx.fillStyle='#6080a0';ctx.font='9px monospace';ctx.textAlign='right';ctx.fillText(gv.toFixed(1),PL-3,gy+3);}
  if(yr[0]<0&&yr[1]>0){ctx.strokeStyle='#c0ccd8';ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(PL,yS(0));ctx.lineTo(PL+cW,yS(0));ctx.stroke();ctx.setLineDash([]);}
  ctx.fillStyle='#6080a0';ctx.font='9px monospace';ctx.textAlign='center';
  harms.forEach(function(h,hi){ctx.fillText(h+'Hz',xS(hi),H-2);});
  series.forEach(function(s,si){
    var pts=harms.map(function(h,hi){return{x:xS(hi),y:yS(s.map[h]||0)};});
    if(si===0){var zero=yS(Math.max(yr[0],Math.min(0,yr[1])));ctx.fillStyle=s.color+'22';ctx.beginPath();ctx.moveTo(pts[0].x,zero);
      pts.forEach(function(p){ctx.lineTo(p.x,p.y);});ctx.lineTo(pts[pts.length-1].x,zero);ctx.closePath();ctx.fill();}
    ctx.strokeStyle=s.color;ctx.lineWidth=s.width||2;if(s.dash)ctx.setLineDash(s.dash);
    ctx.beginPath();pts.forEach(function(p,i){if(i)ctx.lineTo(p.x,p.y);else ctx.moveTo(p.x,p.y);});ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=s.color;pts.forEach(function(p){ctx.beginPath();ctx.arc(p.x,p.y,s.dash?2.5:4,0,Math.PI*2);ctx.fill();});
  });
  ctx.strokeStyle='#dde4ed';ctx.lineWidth=1;ctx.strokeRect(PL,PT,cW,cH);
}
// Generic x/y scatter with optional lines
function drawScatter(canvas,series,opts){
  if(!canvas)return;
  var W=canvas.clientWidth,H=canvas.clientHeight;if(!W||!H)return;
  canvas.width=W;canvas.height=H;
  var ctx=canvas.getContext('2d'),PL=46,PR=12,PT=12,PB=28,cW=W-PL-PR,cH=H-PT-PB;
  var xr=opts.xr,yr=opts.yr;
  function xS(v){return PL+(v-xr[0])/(xr[1]-xr[0]||1)*cW;}
  function yS(v){return PT+cH-(v-yr[0])/(yr[1]-yr[0]||1)*cH;}
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#dde4ed';ctx.lineWidth=.5;ctx.font='9px monospace';ctx.fillStyle='#6080a0';
  for(var t=0;t<=4;t++){var gx=xr[0]+(xr[1]-xr[0])*t/4,gy=yr[0]+(yr[1]-yr[0])*t/4;
    ctx.beginPath();ctx.moveTo(xS(gx),PT);ctx.lineTo(xS(gx),PT+cH);ctx.stroke();ctx.beginPath();ctx.moveTo(PL,yS(gy));ctx.lineTo(PL+cW,yS(gy));ctx.stroke();
    ctx.textAlign='center';ctx.fillText(gx.toFixed(1),xS(gx),PT+cH+11);ctx.textAlign='right';ctx.fillText(gy.toFixed(0),PL-3,yS(gy)+3);}
  ctx.textAlign='center';ctx.fillText(opts.xlabel||'',PL+cW/2,H-2);
  ctx.save();ctx.translate(10,PT+cH/2);ctx.rotate(-Math.PI/2);ctx.fillText(opts.ylabel||'',0,0);ctx.restore();
  (opts.lines||[]).forEach(function(l){ctx.strokeStyle=l.color;ctx.lineWidth=l.width||1.2;if(l.dash)ctx.setLineDash(l.dash);
    ctx.beginPath();ctx.moveTo(xS(l.x0),yS(l.y0));ctx.lineTo(xS(l.x1),yS(l.y1));ctx.stroke();ctx.setLineDash([]);});
  series.forEach(function(s){s.pts.forEach(function(p){ctx.fillStyle=p[2]||s.color;ctx.globalAlpha=p[3]===false?.3:1;
    ctx.beginPath();if(s.shape==='tri'){var x=xS(p[0]),y=yS(p[1]);ctx.moveTo(x,y-5);ctx.lineTo(x+4.5,y+3.5);ctx.lineTo(x-4.5,y+3.5);ctx.closePath();}
    else ctx.arc(xS(p[0]),yS(p[1]),s.r||3.5,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;});});
  ctx.strokeStyle='#dde4ed';ctx.lineWidth=1;ctx.strokeRect(PL,PT,cW,cH);
}
function rangeOf(vals,pad,minSpan){var v=vals.filter(isFinite);if(!v.length)return[-1,1];
  var lo=Math.min.apply(null,v),hi=Math.max.apply(null,v),span=Math.max(hi-lo,minSpan||1);var c=(lo+hi)/2;
  return[c-span/2-span*(pad||.1),c+span/2+span*(pad||.1)];}

      .catch(function(e){console.warn('Supabase load failed:',e.message);setDbStatus('error');setDbNote(e.message);});
  },[authUser]);

  // ── Analysis pipeline ─────────────────────────────────────────────────────
  var detKey=DET_KEYS.map(function(k){return proc[k];}).join('|');
  useEffect(function(){setAiResults({});setSelEv(null);},[detKey]);
  var baseAnalyses=useMemo(function(){
    var o=Object.assign({},proc,{applyLayback:false});
    return files.map(function(f){
      if(f.type!=='field'||!f.packets.length)return null;
      try{return IPA.analyzeField(f.packets,o,labSigs);}catch(e){console.error(e);return null;}
    });
  },[files,detKey,labSigs]);
  var fileAnalyses=useMemo(function(){
    return baseAnalyses.map(function(fa,fi){
      if(!fa)return null;
      var L=proc.applyLayback?proc.laybackM:0,tau=proc.applyLayback?proc.latencyS:0;
      var events=fa.events.map(function(ev){var c=IPA.laybackShift(ev.lat,ev.lon,ev.cog,ev.sog,L,tau);return Object.assign({},ev,{latC:c[0],lonC:c[1]});});
      var track=fa.track.map(function(tp){var k=fa.kin[tp.i];var c=IPA.laybackShift(tp.lat,tp.lon,tp.cog,k.sog,L,tau);return{lat:c[0],lon:c[1],cog:tp.cog,i:tp.i};});
      return Object.assign({},fa,{events:events,track:track});
    });
  },[baseAnalyses,proc.applyLayback,proc.laybackM,proc.latencyS]);

  function finalCls(fi,ei,ev){var ar=aiResults[fi+'-'+ei];return ar&&ar.classification!=='Error'?ar.classification:ev.fusedCls;}
  function finalConf(fi,ei,ev){var ar=aiResults[fi+'-'+ei];return ar&&ar.classification!=='Error'?ar.confidence_pct:ev.fusedConf;}

  var refLon=useMemo(function(){for(var i=0;i<files.length;i++){var p=files[i].packets.find(function(pk){return pk.lon!==null;});if(p)return p.lon;}return NaN;},[files]);
  var wps=useMemo(function(){return IPA.alignWaypointHemisphere(waypoints,refLon);},[waypoints,refLon]);

  var fieldIdx=useMemo(function(){return fileAnalyses.map(function(fa,fi){return fa?fi:-1;}).filter(function(fi){return fi>=0;});},[fileAnalyses]);
  var fileTracks=useMemo(function(){return fieldIdx.map(function(fi){return{fi:fi,run:files[fi].run,track:fileAnalyses[fi].track,trackLenM:fileAnalyses[fi].trackLenM};});},[fieldIdx,fileAnalyses]);
  var points=useMemo(function(){
    var pts=[];
    fieldIdx.forEach(function(fi){fileAnalyses[fi].events.forEach(function(ev,ei){
      if(ev.latC===null||ev.latC===undefined)return;
      pts.push({lat:ev.latC,lon:ev.lonC,cls:finalCls(fi,ei,ev),conf:finalConf(fi,ei,ev),fi:fi,ei:ei,run:files[fi].run,cog:ev.cog,snr:ev.maxSNRall});
    });});
    return pts;
  },[fieldIdx,fileAnalyses,aiResults]);
  var sites=useMemo(function(){return IPA.buildSites(points,fileTracks,wps,proc);},[points,fileTracks,wps,proc.mergeRadiusM,proc.passRadiusM]);
  var calib=useMemo(function(){
    if(!wps.length)return null;
    var fe=fieldIdx.map(function(fi){return{fi:fi,run:files[fi].run,events:baseAnalyses[fi].events};});
    var m=IPA.collectCalibrationMatches(fe,wps,proc);
    return IPA.fitLayback(m);
  },[wps,fieldIdx,baseAnalyses,proc.matchRadiusM,proc.maxCrossM,proc.minSNRcal]);
  var detMetrics=useMemo(function(){return wps.length&&fileTracks.length?IPA.detectionMetrics(fileTracks,points,wps,proc):null;},
    [fileTracks,points,wps,proc.passRadiusM,proc.detRadiusM]);

  // Active-file analysis & chart series
  var analysis=useMemo(function(){
    if(activeIdx===null||!files[activeIdx])return null;
    var f=files[activeIdx];
    if(f.type==='lab')return{isLab:true,run:f.run,labStats:IPA.computeLabStats(f.packets),nPkts:f.packets.length};
    var fa=fileAnalyses[activeIdx];if(!fa)return null;
    var pkts=f.packets,harms=fa.harms,bg=fa.bg,T=proc.mode==='legacy'?3:proc.zThresh;
    var ser=function(h){return pkts.map(function(pk){var v=pk.freqs[h];return v?v[0]*1000:NaN;});};
    var d1=ser(harms[0]),dH=ser(harms[5]),d3=ser(harms[2]);
    var mag=pkts.map(function(pk){var v=pk.freqs[harms[0]];return v?v[1]:NaN;});
    var p0=bg.perHz[harms[0]],base0=pkts.map(function(_,i){return IPA.bgAt(bg,harms[0],i);});
    var xL=pkts.map(function(pk){var s=(pk.ts||'').split(' ')[1];return s?s.substring(0,5):'';});
    var im={};pkts.forEach(function(pk,i){im[pk.idx]=i;});
    var bgEv=fa.events.map(function(ev,ei){return{i0:im[ev.pktStart]!==undefined?im[ev.pktStart]:-1,i1:im[ev.pktEnd]!==undefined?im[ev.pktEnd]:-1,
      color:MAT_COLORS[finalCls(activeIdx,ei,ev)]||'#aaa',sel:ei===selEv};});
    return{isLab:false,pkts:pkts,xmt:fa.xmt,harms:harms,bg:bg,clusters:fa.clusters,events:fa.events,d1:d1,mag:mag,dH:dH,d3:d3,xL:xL,bgEv:bgEv,
      hiT:base0.map(function(b){return b+T*p0.std;}),loT:base0.map(function(b){return b-T*p0.std;}),base0:base0,T:T};
  },[files,activeIdx,fileAnalyses,aiResults,selEv,proc.mode,proc.zThresh]);

  useEffect(function(){
    if(!analysis||analysis.isLab||mainTab!=='analysis')return;
    var a=analysis;
    var allPh=a.d1.concat(a.dH).filter(function(v){return isFinite(v)&&Math.abs(v)<200;});
    var phMin=allPh.length?Math.min.apply(null,allPh):-50,phMax=allPh.length?Math.max.apply(null,allPh):50;
    var yr_ph=[Math.floor(phMin/10)*10-5,Math.ceil(phMax/10)*10+5];
    var allMag=a.mag.filter(function(v){return isFinite(v)&&v>0;});
    var yr_mag=[Math.floor((allMag.length?Math.min.apply(null,allMag):0)/100)*100-50,Math.ceil((allMag.length?Math.max.apply(null,allMag):1000)/100)*100+50];
    var ds=[{data:a.d1,color:'#0071b8',width:1.2}];
    var o={xLabels:a.xL,bgEvents:a.bgEv};
    if(a.bg.mode==='robust'){ds.push({data:a.hiT,color:'rgba(176,32,64,.55)',width:1,dash:[5,3]},{data:a.loT,color:'rgba(176,32,64,.55)',width:1,dash:[5,3]},{data:a.base0,color:'#8099b0',width:1,dash:[2,2]});}
    else{o.threshLo=a.bg.mean-3*a.bg.std;o.threshHi=a.bg.mean+3*a.bg.std;}
    drawChart(tsRef.current,ds,yr_ph,o);
    drawChart(highRef.current,[{data:a.d3,color:'#b07800',width:1},{data:a.dH,color:'#1a8c4e',width:1.2}],yr_ph,o);
    drawChart(magRef.current,[{data:a.mag,color:'#1a8c4e',width:1.2}],yr_mag,o);
    var ei=(selEv!==null&&selEv<a.events.length)?selEv:0,ev=a.events[ei];
    if(ev){
      var cls=finalCls(activeIdx,ei,ev),series=[{map:ev.dpDev,color:MAT_COLORS[cls]||'#0071b8'}];
      if(ev.labBest){var sig=labSigs.find(function(s){return s.material===ev.labBest.material&&s.xmt===a.xmt;});
        var blank=labSigs.filter(function(s){return s.material==='Seawater blank'&&s.xmt===a.xmt;}).pop();
        if(sig){var mp={};a.harms.forEach(function(h){var k=sig.freqs.indexOf(h);if(k<0)return;var v=sig.mean[k];
          if(blank){var kb=blank.freqs.indexOf(h);if(kb>=0)v-=blank.mean[kb];}mp[h]=v*ev.labBest.scale;});
          series.push({map:mp,color:MAT_COLORS[sig.material]||'#555',dash:[4,3],width:1.5});}}
      var vals=[];series.forEach(function(s){a.harms.forEach(function(h){if(isFinite(s.map[h]))vals.push(s.map[h]);});});
      drawSpectral(specRef.current,series,a.harms,[Math.floor(Math.min(-5,Math.min.apply(null,vals))/10)*10-5,Math.ceil(Math.max(5,Math.max.apply(null,vals))/10)*10+5]);
    }
  },[analysis,selEv,aiResults,mainTab,labSigs]);

  // ── Leaflet map ───────────────────────────────────────────────────────────
  useEffect(function(){
    if(mainTab!=='map'||!mapRef.current)return;
    var TILES={satellite:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      street:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      topo:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
      noaa:'https://tileservice.charts.noaa.gov/tiles/50000_1/{z}/{x}/{y}.png'};
    var ATTRIBS={satellite:'Tiles &copy; Esri',street:'&copy; OpenStreetMap contributors',topo:'Tiles &copy; Esri',noaa:'NOAA ENC'};
    if(!leafletMap.current||leafletMap.current._container!==mapRef.current){

      var m=L.map(mapRef.current,{center:[47.62,-122.50],zoom:14});
      leafletMap.current=m;
      leafletLayers.current={baseTile:null,tracks:L.layerGroup().addTo(m),hotspots:L.layerGroup().addTo(m),wps:L.layerGroup().addTo(m)};

    var map=leafletMap.current,LL=leafletLayers.current;

    LL.tracks.clearLayers();LL.hotspots.clearLayers();LL.wps.clearLayers();
    var bounds=[];
    if(showLines){
      files.forEach(function(f,fi){
        if(f.type!=='field'||(visibleFiles&&visibleFiles.indexOf(fi)<0))return;
        var fa=fileAnalyses[fi];if(!fa||!fa.track.length)return;
        var lls=fa.track.map(function(tp){return[tp.lat,tp.lon];});
        lls.forEach(function(ll){bounds.push(ll);});
        var col=RUN_COLORS[fi%RUN_COLORS.length];
        runGroups.forEach(function(g){if(g.fileIds.indexOf(fi)>=0)col=g.color;});
        var isA=fi===activeIdx;
        var pl=L.polyline(lls,{color:col,weight:isA?4:2.5,opacity:isA?1:.7});
        L.circleMarker(lls[0],{radius:5,fillColor:col,color:'#fff',weight:1.5,fillOpacity:1}).addTo(LL.tracks);
        pl.on('click',function(){setActiveIdx(fi);setMainTab('analysis');setSelEv(null);});
        pl.bindTooltip('<div style="font-family:monospace;font-size:11px"><b>'+f.run+'</b><br>'+f.packets.length+' pkts · '+f.xmt+'Hz'+
          (proc.applyLayback&&(proc.laybackM||proc.latencyS)?'<br>sensor track (layback '+fmt(proc.laybackM)+' m)':'')+'</div>',{sticky:true});
        pl.addTo(LL.tracks);
      });
    }
    if(showHotspots){
      sites.forEach(function(s){
        var key=s.lat.toFixed(5)+','+s.lon.toFixed(5);if(hiddenHotspots[key])return;
        if(visibleFiles&&!Object.keys(s.runs).some(function(fi){return visibleFiles.indexOf(+fi)>=0;}))return;
        var col=MAT_COLORS[s.cls]||'#808080',multi=s.nRuns>1;
        bounds.push([s.lat,s.lon]);
        var c=L.circle([s.lat,s.lon],{radius:Math.max(proc.mergeRadiusM/2,s.scatterM*2,4),color:col,weight:s.tier==='Confirmed'?3:multi?2:1.2,
          opacity:multi?.95:.6,fillColor:col,fillOpacity:.18,dashArray:multi?null:'6,4'});
        c.bindTooltip('<div style="font-family:monospace;font-size:11px"><b style="color:'+col+'">'+s.cls+'</b> · '+s.tier+'<br>'+
          s.nDet+' det · '+s.nRuns+'/'+s.nPass+' runs ('+pct(s.repeatability)+')'+(s.reciprocal?' · reciprocal':'')+'<br>'+
          'consensus '+pct(s.consensus)+' · scatter '+fmt(s.scatterM)+' m'+(s.nearestWp?'<br>'+s.nearestWp+' @ '+fmt(s.nearestWpM)+' m':'')+'</div>',{sticky:true});
        c.addTo(LL.hotspots);
        L.marker([s.lat,s.lon],{interactive:false,icon:L.divIcon({className:'',iconSize:[120,16],iconAnchor:[60,-12],
          html:'<div style="font-family:monospace;font-size:9px;font-weight:bold;color:'+col+';white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff">'+
          (multi?s.nRuns+'× ':'')+s.cls.substring(0,12)+'</div>'})}).addTo(LL.hotspots);
      });
    }
    if(showWps){
      wps.forEach(function(w){
        bounds.push([w.lat,w.lon]);
        L.marker([w.lat,w.lon],{icon:L.divIcon({className:'',iconSize:[14,14],iconAnchor:[7,7],
          html:'<div style="width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid #ffcc00;filter:drop-shadow(0 0 1px #000)"></div>'})})
          .bindTooltip('<div style="font-family:monospace;font-size:11px"><b>'+w.name+'</b>'+(w.material?'<br>'+w.material:'')+'</div>',{direction:'top'}).addTo(LL.wps);
      });
    }
    if(mapFocus){map.setView(mapFocus,18);}
    else if(bounds.length>=2){try{map.fitBounds(L.latLngBounds(bounds),{padding:[30,30],maxZoom:17});}catch(e){}}
  },[mainTab,files,fileAnalyses,activeIdx,runGroups,showLines,showHotspots,showWps,visibleFiles,hiddenHotspots,sites,wps,mapLayer,mapFocus]);

  // ── File loading (IPA packets, or waypoint CSV/GPX) ───────────────────────
  var loadFiles=useCallback(function(fileList,forceWp){
    var arr=Array.prototype.slice.call(fileList);
    Promise.all(arr.map(function(file){return file.text().then(function(text){
      var pkts=forceWp?[]:IPA.parseAnyFile(text);
      if(pkts.length)return{kind:'ipa',f:{name:file.name,run:pkts[0].run||file.name,packets:pkts,xmt:pkts[0].xmt,type:pkts[0].type}};
      var w=IPA.parseWaypoints(text,file.name);
      if(w.length)return{kind:'wp',w:w};
      return null;
    });})).then(function(res){
      var nf=res.filter(function(r){return r&&r.kind==='ipa';}).map(function(r){return r.f;});
      var nw=[];res.forEach(function(r){if(r&&r.kind==='wp')nw=nw.concat(r.w);});
      if(nf.length)setFiles(function(prev){var u=prev.concat(nf);if(!prev.length)setActiveIdx(0);return u;});
      if(nw.length)setWaypoints(function(prev){return prev.concat(nw);});
      var bad=res.filter(function(r){return !r;}).length;
      if(bad)alert(bad+' file(s) could not be parsed as IPA packets or waypoints.');
    });
  },[]);

  // ── AI classification ─────────────────────────────────────────────────────
  function runAI(fi,ei){
    var fa=fileAnalyses[fi];if(!fa||!fa.events[ei])return Promise.resolve();
    var key=fi+'-'+ei;setAiLoading(key);
    return classifyWithClaude(fa.events[ei],fa.harms,fa.bg,training,apiKey,aiModel).then(function(r){
      setAiResults(function(p){var n=Object.assign({},p);n[key]=r;return n;});
    }).catch(function(e){
      setAiResults(function(p){var n=Object.assign({},p);n[key]={classification:'Error',confidence_pct:0,confidence_label:'Error',key_indicators:'',reasoning:e.message,caution:null};return n;});
    }).finally(function(){setAiLoading(null);});
  }
  var doAI=function(fi,ei){if(!apiKey){alert('Enter API key');return;}runAI(fi,ei).then(function(){setSelEv(ei);});};
  var doAIAll=function(){
    if(!analysis||analysis.isLab||!apiKey)return;
    var fi=activeIdx,n=analysis.events.length,i=0;
    (function next(){if(i>=n)return;var ei=i++;runAI(fi,ei).then(function(){setTimeout(next,500);});})();
  };

  // ── Training confirmations ────────────────────────────────────────────────
  var saveTraining=function(fi,ei){
    if(!confMat)return;
    var fa=fileAnalyses[fi];if(!fa||!fa.events[ei])return;
    var ev=fa.events[ei],harms=fa.harms,ar=aiResults[fi+'-'+ei];
    var entry={material:confMat,run:files[fi].run,ts:ev.ts,
      fv:{dp1:ev.dpDev[harms[0]]||0,dp3:ev.dpDev[harms[2]]||0,dp_last:ev.dpDev[harms[5]]||0,magPct:ev.magPct,maxSNR:ev.maxSNRall,slope:ev.phaseSlope},
      aiConf:ar?ar.confidence_pct:null,rulesCls:ev.cls,aiCls:ar&&ar.classification!=='Error'?ar.classification:null,
      labCls:ev.labBest?ev.labBest.material:null,labCos:ev.labBest?ev.labBest.cos:null,fusedCls:ev.fusedCls,predConf:ev.fusedConf,
      dpDev:ev.dpDev,lat:ev.latC,lon:ev.lonC,cog:ev.cog,sog:ev.sog,procMode:proc.mode};
    setTraining(function(p){return p.concat([entry]);});
    setConfMat('');setDbStatus('loading');
    saveTrainingToDB(entry,harms).then(function(res){
      var d=res.data;
      if(d&&d[0])setTraining(function(p){var u=p.slice();var k=u.lastIndexOf(entry);if(k>=0)u[k]=Object.assign({},u[k],{id:d[0].id});return u;});
      setDbStatus('ok');if(!res.extended)setDbNote('Saved without prediction columns — run supabase_schema.sql so accuracy metrics persist.');
    }).catch(function(e){console.warn('Supabase save failed:',e.message);setDbStatus('error');setDbNote(e.message);});
  };

  // ── Lab signatures ────────────────────────────────────────────────────────
  function addLabSig(grp,material,run){
    var s=IPA.labSignatureFromGroup(grp,material,run);s.src='local';
    setLabSigs(function(p){return p.concat([s]);});
    saveLabSigDB(s).then(function(d){if(d&&d[0])setLabSigs(function(p){return p.map(function(x){return x===s?Object.assign({},x,{id:d[0].id,src:'db'}):x;});});})
      .catch(function(e){setDbNote('Lab signature kept for this session only ('+e.message+'). Run supabase_schema.sql to share it.');});
  }
  function removeLabSig(s){setLabSigs(function(p){return p.filter(function(x){return x!==s;});});if(s.id)deleteLabSigDB(s.id).catch(function(){});}

  // Run group helpers
  var createGroup=function(){if(!newGroupName.trim())return;
    setRunGroups(function(p){return p.concat([{id:'g'+Date.now(),name:newGroupName.trim(),color:newGroupColor,fileIds:[]}]);});
    setNewGroupModal(false);setNewGroupName('');};
  var addToGroup=function(fi,gid){setRunGroups(function(p){return p.map(function(g){return(g.id===gid&&g.fileIds.indexOf(fi)<0)?Object.assign({},g,{fileIds:g.fileIds.concat([fi])}):g;});});
    setAddToGroupModal(null);setSelGroupId('');};
  var removeFromGroup=function(fi,gid){setRunGroups(function(p){return p.map(function(g){return g.id===gid?Object.assign({},g,{fileIds:g.fileIds.filter(function(i){return i!==fi;})}):g;});});};
  var deleteGroup=function(id){setRunGroups(function(p){return p.filter(function(g){return g.id!==id;});});};

  // ── Classifier accuracy data ──────────────────────────────────────────────
  var accuracy=useMemo(function(){
    var rows=training.filter(function(t){return t.material;}),pred,conf;
    if(metricPred==='knn'){var k=IPA.looKnn(rows,3);if(!k)return{n:0,rows:rows.length};pred=k;conf=null;}
    else{
      var fld={fused:'fusedCls',rules:'rulesCls',ai:'aiCls',lab:'labCls'}[metricPred];
      var cf={fused:'predConf',ai:'aiConf'}[metricPred];
      rows=rows.filter(function(t){return t[fld];});
      pred=rows.map(function(t){return t[fld];});conf=cf?rows.map(function(t){return t[cf];}):null;
    }
    if(!rows.length)return{n:0,rows:training.length};
    var truth=rows.map(function(t){return t.material;});
    if(metricLevel==='family'){truth=truth.map(IPA.family);pred=pred.map(IPA.family);}
    var c=IPA.confusion(truth,pred);
    c.rel=conf?IPA.reliability(truth,pred,conf):null;
    return c;
  },[training,metricPred,metricLevel]);

  // Derived render values
  var af=analysis;
  var activeEv=(af&&!af.isLab&&selEv!==null&&selEv<af.events.length)?af.events[selEv]:null;
  var aiKey=(activeIdx!==null&&selEv!==null)?activeIdx+'-'+selEv:null;
  var aiRes=aiKey?aiResults[aiKey]:null;

  if(authUser===null){
    return <div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--font-mono)'}}><div style={{color:'var(--dim2)',fontSize:12}}>Checking session...</div></div>;
  }
  if(authUser===false){
    return (
      <div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)',fontFamily:'var(--font-mono)'}}>
        <div style={{background:'var(--panel)',border:'1px solid var(--border2)',borderRadius:6,padding:'40px 48px',textAlign:'center',maxWidth:380}}>
          <div style={{fontSize:22,fontWeight:700,color:'var(--accent)',marginBottom:8,letterSpacing:'.05em'}}>IPA MIP CLASSIFIER</div>
          <div style={{fontSize:11,color:'var(--dim2)',marginBottom:6}}>WaTech-MatChar-r7 · {APP_VERSION}</div>
          <div style={{width:40,height:1,background:'var(--border2)',margin:'16px auto'}}/>
          <div style={{fontSize:11,color:'var(--dim3)',marginBottom:24,lineHeight:1.7}}>Sign in with your GitHub account to access the classifier and shared training database.</div>
          <button onClick={signInWithGitHub} style={{display:'flex',alignItems:'center',gap:10,margin:'0 auto',background:'#24292e',color:'#fff',border:'none',borderRadius:4,
            padding:'11px 22px',cursor:'pointer',fontSize:12,fontFamily:'var(--font-mono)',fontWeight:700,letterSpacing:'.04em'}}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.020-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
            Sign in with GitHub
          </button>
          <div style={{fontSize:9,color:'var(--dim)',marginTop:16,lineHeight:1.6}}>Access restricted to authorised IPA team members.<br/>Contact coastalsensing to request access.</div>
        </div>
      </div>);
  }

  var nField=files.filter(function(f){return f.type==='field';}).length;
  var tiersCount={};sites.forEach(function(s){tiersCount[s.tier]=(tiersCount[s.tier]||0)+1;});
  var multi=sites.filter(function(s){return s.tier!=='Single run'&&s.tier!=='Weak repeat';});
  var tierCls=function(t){return 'tier tier-'+t.split(' ')[0];};

  return (
    <div className="app">
      <div className="topbar">
        <h1>IPA MIP CLASSIFIER</h1>
        <div className="sep"/>
        <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:'var(--dim2)'}}>{files.length} files · {wps.length} wp · {labSigs.length} lab refs</span>
        <div className="sep"/>
        <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:training.length?'var(--pos)':'var(--dim2)'}}>{training.length} training</span>
        <div className="sep"/>
        <span style={{fontFamily:'var(--font-mono)',fontSize:10,color:proc.mode==='legacy'?'#b07800':'var(--dim2)'}}>{proc.mode==='legacy'?'LEGACY v26 detection':'robust detection'}{proc.applyLayback&&(proc.laybackM||proc.latencyS)?' · layback '+fmt(proc.laybackM)+' m':''}</span>
        <div style={{flex:1}}/>
        <span title={dbNote} style={{fontFamily:'var(--font-mono)',fontSize:10,cursor:dbNote?'help':'default',
          color:dbStatus==='ok'?(dbNote?'#b07800':'var(--pos)'):dbStatus==='error'?'var(--neg)':'#b07800'}}>
          {dbStatus==='loading'?'⟳ syncing':dbStatus==='ok'?(dbNote?'⚠ DB partial':'✓ DB synced'):'✗ DB offline'}
        </span>
        <div className="sep"/>
        <span style={{fontFamily:'var(--font-mono)',fontSize:10,color:'var(--dim)'}}>WaTech-MatChar-r7 · {APP_VERSION}</span>
        <div className="sep"/>
        <span style={{fontFamily:'var(--font-mono)',fontSize:10,color:'var(--dim3)',maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
          {authUser.email||(authUser.user_metadata&&authUser.user_metadata.user_name)||''}</span>
        <button onClick={signOut} style={{background:'none',border:'1px solid var(--border2)',color:'var(--dim2)',fontFamily:'var(--font-mono)',fontSize:9,padding:'3px 8px',borderRadius:2,cursor:'pointer',marginLeft:4}}>Sign out</button>
      </div>

      <div className="main">
        <div className="sidebar">
          <div className={drag?'upload-zone drag':'upload-zone'}
            onDragOver={function(e){e.preventDefault();setDrag(true);}} onDragLeave={function(){setDrag(false);}}
            onDrop={function(e){e.preventDefault();setDrag(false);loadFiles(e.dataTransfer.files);}}
            onClick={function(){fileRef.current&&fileRef.current.click();}}>
            <div className="icon">📡</div>
            <p>Drop <code>_p.txt</code> files (lab or field)<br/>or waypoint <code>.csv/.gpx</code> · <span>click to browse</span></p>
          </div>
          <input ref={fileRef} type="file" accept=".txt,.csv,.gpx" multiple style={{display:'none'}} onChange={function(e){loadFiles(e.target.files);e.target.value='';}}/>
          <input ref={wpRef} type="file" accept=".csv,.txt,.gpx,.tsv" multiple style={{display:'none'}} onChange={function(e){loadFiles(e.target.files,true);e.target.value='';}}/>

          {files.length>0 && <div className="sidebar-label">Files</div>}
          {files.map(function(f,i){
            var grp=runGroups.find(function(g){return g.fileIds.indexOf(i)>=0;});
            var fa=fileAnalyses[i];
            return (
              <div key={i} className={activeIdx===i?'file-item active':'file-item'} onClick={function(){setActiveIdx(i);setSelEv(null);}}>
                <div className="file-dot" style={{background:grp?grp.color:(f.type==='lab'?'#607a90':'#8099b0')}}/>
                <div style={{flex:1,overflow:'hidden'}}>
                  <div className="file-name">{f.run}</div>
                  <div className="file-info">{f.packets.length}pkt · {f.xmt}Hz · {f.type}{fa?' · '+fa.events.length+' ev':''}</div>
                </div>
                <button title="Add to group" onClick={function(e){e.stopPropagation();setAddToGroupModal(i);setSelGroupId('');}}
                  style={{background:'none',border:'1px solid var(--border2)',color:'var(--dim2)',borderRadius:2,padding:'2px 6px',cursor:'pointer',fontSize:11,flexShrink:0}}>+</button>
              </div>);
          })}

          {files.length>0 && (
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:4}}>
              <span className="sidebar-label">Run Groups</span>
              <button className="btn btn-primary btn-sm" onClick={function(){setNewGroupModal(true);}}>+ Group</button>
            </div>)}
          {runGroups.map(function(g){
            var isExp=expandedGroup===g.id;
            return (
              <div key={g.id} className="run-group">
                <div className="run-group-hdr" onClick={function(){setExpandedGroup(isExp?null:g.id);}}>
                  <div className="run-swatch" style={{background:g.color}}/>
                  <span className="run-group-name">{g.name}</span>
                  <span style={{fontSize:9,color:'var(--dim)'}}>{g.fileIds.length}f</span>
                  <button onClick={function(e){e.stopPropagation();deleteGroup(g.id);}} style={{background:'none',border:'none',color:'var(--neg)',cursor:'pointer',fontSize:13,padding:'0 2px',marginLeft:4}}>×</button>
                </div>
                {isExp && (
                  <div className="run-group-body">
                    {g.fileIds.map(function(fi){var f=files[fi];if(!f)return null;return (
                      <div key={fi} className={activeIdx===fi?'run-entry active':'run-entry'} onClick={function(){setActiveIdx(fi);setSelEv(null);}}>
                        <div style={{width:7,height:7,borderRadius:'50%',background:g.color,flexShrink:0}}/>
                        <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{f.run}</span>
                        <button onClick={function(e){e.stopPropagation();removeFromGroup(fi,g.id);}} style={{background:'none',border:'none',color:'var(--dim)',cursor:'pointer',fontSize:11}}>×</button>
                      </div>);})}
                    {!g.fileIds.length && <span style={{fontSize:10,color:'var(--dim)',fontFamily:'var(--font-mono)'}}>No files added</span>}
                  </div>)}
              </div>);
          })}

          {/* Waypoints */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:4}}>
            <span className="sidebar-label">Known waypoints ({wps.length})</span>
            <button className="btn btn-ghost btn-sm" onClick={function(){wpRef.current&&wpRef.current.click();}}>Load</button>
          </div>
          {wps.length>0 && (
            <div>
              <div style={{display:'flex',flexDirection:'column',gap:2,maxHeight:90,overflowY:'auto'}}>
                {wps.map(function(w,i){return (
                  <div key={i} style={{display:'flex',gap:5,alignItems:'center',fontSize:10,fontFamily:'var(--font-mono)',padding:'2px 5px',background:'var(--panel2)',borderRadius:2}}>
                    <span style={{color:'#b08800'}}>▲</span><span style={{fontWeight:700}}>{w.name}</span>
                    <span style={{flex:1,color:'var(--dim)',fontSize:9,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{w.material||''}{w.flipped?' (lon→W)':''}</span>
                    {!w.id && <span title="not saved to DB" style={{color:'var(--dim)',fontSize:9}}>local</span>}
                  </div>);})}
              </div>
              <div className="row" style={{marginTop:4}}>
                {waypoints.some(function(w){return !w.id;}) && <button className="btn btn-ghost btn-sm" onClick={function(){
                  var loc=waypoints.filter(function(w){return !w.id;});
                  saveWaypointsDB(IPA.alignWaypointHemisphere(loc,refLon)).then(function(d){
                    setWaypoints(function(p){return p.filter(function(w){return w.id;}).concat(d.map(function(r){return{id:r.id,name:r.name,lat:r.lat,lon:r.lon,material:r.material,source:r.source};}));});
                  }).catch(function(e){alert('Could not save waypoints: '+e.message+'\nRun supabase_schema.sql in Supabase first.');});
                }}>Save to DB</button>}
                <button className="btn btn-ghost btn-sm" onClick={function(){
                  var ids=waypoints.filter(function(w){return w.id;}).map(function(w){return w.id;});
                  if(ids.length&&!window.confirm('Also delete '+ids.length+' shared waypoints from the database?')){setWaypoints(function(p){return p.filter(function(w){return w.id;});});return;}
                  if(ids.length)deleteWaypointsDB(ids).catch(function(e){console.warn(e);});
                  setWaypoints([]);
                }}>Clear</button>
              </div>
            </div>)}

          {/* Processing */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:4,cursor:'pointer'}} onClick={function(){setShowProc(!showProc);}}>
            <span className="sidebar-label">Processing {showProc?'▾':'▸'}</span>
            <span className="pill">{proc.mode}</span>
          </div>
          {showProc && (
            <div className="param-grid">
              <div className="param" style={{gridColumn:'1/-1'}}><label>Detection mode</label>
                <select value={proc.mode} onChange={function(e){setProc({mode:e.target.value});}}>
                  <option value="robust">Robust (detrended, multi-harmonic)</option>
                  <option value="legacy">Legacy v26 (fundamental 3σ only)</option>
                </select></div>
              {proc.mode==='robust' && <Num label="Detrend window (pkts)" value={proc.detrendWin} onChange={function(v){setProc({detrendWin:Math.max(5,Math.round(v))});}}/>}
              {proc.mode==='robust' && <Num label="z threshold" step={0.5} value={proc.zThresh} onChange={function(v){setProc({zThresh:v});}}/>}
              {proc.mode==='robust' && <Num label="Harmonic hits" value={proc.minHarmHits} onChange={function(v){setProc({minHarmHits:Math.max(1,Math.round(v))});}}/>}
              {proc.mode==='robust' && <Num label="Gap (pkts)" value={proc.gapPkts} onChange={function(v){setProc({gapPkts:Math.max(0,Math.round(v))});}}/>}
              {proc.mode==='robust' && <Num label="Min pkts / event" value={proc.minPkts} onChange={function(v){setProc({minPkts:Math.max(1,Math.round(v))});}}/>}
              <Num label="Lab match cos ≥" step={0.01} value={proc.labCosMin} onChange={function(v){setProc({labCosMin:v});}}/>
              <button className="btn btn-ghost btn-sm" style={{gridColumn:'1/-1'}} onClick={function(){setProc(Object.assign({},IPA.DEFAULT_PROC,{laybackM:proc.laybackM,latencyS:proc.latencyS,applyLayback:proc.applyLayback}));}}>Reset detection defaults</button>
            </div>)}

          {training.length>0 && (
            <div>
              <div className="sep" style={{height:1,width:'100%',background:'var(--border)',margin:'4px 0'}}/>
              <div className="sidebar-label">Training ({training.length})</div>
              <div style={{display:'flex',flexDirection:'column',gap:3,maxHeight:100,overflowY:'auto'}}>
                {training.map(function(t,i){return (
                  <div key={i} style={{display:'flex',alignItems:'center',gap:5,padding:'3px 5px',borderRadius:2,background:'var(--panel2)',fontSize:10,fontFamily:'var(--font-mono)'}}>
                    <div style={{width:7,height:7,borderRadius:'50%',flexShrink:0,background:MAT_COLORS[t.material]||'#8099b0'}}/>
                    <span style={{fontWeight:700,color:MAT_COLORS[t.material]||'var(--dim2)'}}>{t.material}</span>
                    <span style={{flex:1,fontSize:9,color:'var(--dim)',marginLeft:4}}>{(t.run||'').substring(0,10)}</span>
                    <button onClick={function(){setTraining(function(p){return p.filter(function(_,j){return j!==i;});});if(t.id)deleteTrainingFromDB(t.id).catch(function(e){console.warn(e);});}}
                      style={{background:'none',border:'none',color:'var(--dim)',cursor:'pointer',fontSize:11,padding:'0 2px'}}>×</button>
                  </div>);})}
              </div>
            </div>)}
          {files.length>0 && (
            <button className="btn btn-ghost btn-sm" onClick={function(){setFiles([]);setActiveIdx(null);setAiResults({});setSelEv(null);setRunGroups([]);}}>Clear all files</button>)}
        </div>

        <div className="content">
          <div className="tab-row" style={{margin:'-14px -14px 0',padding:'0 14px'}}>
            {[['analysis','Analysis'],['map','Map'],['lab','Lab Stats'],['layback','Layback'],['metrics','Metrics']].map(function(t){
              return <div key={t[0]} className={mainTab===t[0]?'tab active':'tab'} onClick={function(){setMainTab(t[0]);if(t[0]!=='map')setMapFocus(null);}}>{t[1]}</div>;})}
          </div>

          {mainTab==='analysis' && (
            <div>
              {!af && <div className="empty"><div className="icon">◎</div><p>Load <code>_p.txt</code> files to begin</p></div>}
              {af && af.isLab && <div className="empty"><div className="icon">🔬</div><p>Lab file selected — tag it as a reference in the <strong>Lab Stats</strong> tab</p></div>}
              {af && !af.isLab && (
                <div>
                  <div className="statsbar">
                    <Tile label="Run" small value={af.pkts[0]?af.pkts[0].run.substring(0,16):''} sub={af.pkts.length+'pkt · '+af.xmt+'Hz'}/>
                    <Tile label={af.bg.mode==='robust'?'BG Δφ median':'BG Δφ mean'} value={af.bg.mean.toFixed(3)} sub={'mrad at '+af.xmt+'Hz'}/>
                    <Tile label={af.bg.mode==='robust'?'Noise σ (MAD)':'BG std dev'} value={af.bg.std.toFixed(3)} sub={af.bg.mode==='robust'?'detrended, 1.4826·MAD':'mrad ddof=1'}/>
                    <Tile label={af.bg.mode==='robust'?af.T+'σ band':'3σ threshold'} value={af.bg.mode==='robust'?'±'+(af.T*af.bg.std).toFixed(2):(af.bg.mean-3*af.bg.std).toFixed(2)}
                      sub={af.bg.mode==='robust'?'around running median':(af.bg.mean+3*af.bg.std).toFixed(2)+' mrad'}/>
                    <Tile label="Events" value={af.events.length} color={af.events.length?'#b07800':'var(--pos)'} sub={af.clusters.reduce(function(a,c){return a+c.length;},0)+' anom pkts'}/>
                  </div>
                  <div className="charts-grid" style={{marginTop:8}}>
                    <div className="chart-panel full">
                      <div className="chart-title">Δφ {af.xmt}Hz ch1-0 (mrad) — {af.bg.mode==='robust'?'running-median baseline ± '+af.T+'σ':'3σ threshold'}<span>shaded = events</span></div>
                      <canvas ref={tsRef} style={{height:110}} height={110}/>
                    </div>
                    <div className="chart-panel">
                      <div className="chart-title">Δφ {af.harms[2]}Hz (amber) · {af.harms[5]}Hz (green)</div>
                      <canvas ref={highRef} style={{height:100}} height={100}/>
                    </div>
                    <div className="chart-panel">
                      <div className="chart-title">Deviation spectrum — event {selEv!==null?selEv+1:'1'}
                        <span style={{fontSize:9}}>{activeEv&&activeEv.labBest?'dashed = '+activeEv.labBest.material+' (lab, scaled)':''}</span></div>
                      <canvas ref={specRef} style={{height:100}} height={100}/>
                    </div>
                    <div className="chart-panel full">
                      <div className="chart-title">Ch1 magnitude at {af.xmt}Hz (counts)</div>
                      <canvas ref={magRef} style={{height:75}} height={75}/>
                    </div>
                  </div>
                  <div className="chart-panel full" style={{padding:'8px 0 0',marginTop:8}}>
                    <div className="chart-title" style={{padding:'0 10px 7px',display:'flex',alignItems:'center',gap:8}}>
                      <span>Events — {af.events.length}</span>
                      <span style={{color:'var(--dim)',flex:1,fontSize:9}}>deviations from local background · click row for spectrum</span>
                      <button className="btn btn-ai btn-sm" onClick={doAIAll} disabled={!apiKey||!af.events.length||!!aiLoading}>{aiLoading?'Running...':'⚡ AI All'}</button>
                    </div>
                    <div className="events-wrap">
                      <table className="events-table">
                        <thead><tr>
                          <th>#</th><th>Time</th><th>Pkts</th><th>dev {af.harms[0]}Hz</th><th>dev {af.harms[2]}Hz</th><th>dev {af.harms[5]}Hz</th>
                          <th>Mag%</th><th>SNR</th><th>Hdg</th><th>Lab match</th><th>Class</th><th>Conf</th><th>Src</th><th>AI</th>
                        </tr></thead>
                        <tbody>
                          {af.events.map(function(ev,ei){
                            var ak=activeIdx+'-'+ei,ar=aiResults[ak],ld=aiLoading===ak;
                            var cls=finalCls(activeIdx,ei,ev),conf=finalConf(activeIdx,ei,ev);
                            var cc=conf>75?'var(--pos)':conf>50?'#b07800':'var(--neg)';
                            var d0=ev.dpDev[af.harms[0]]||0,d2=ev.dpDev[af.harms[2]]||0,d5=ev.dpDev[af.harms[5]]||0;
                            var src=ar&&ar.classification!=='Error'?'AI':ev.fusedSrc;
                            return (
                              <tr key={ei} className={selEv===ei?'selected':''} style={{cursor:'pointer'}} onClick={function(){setSelEv(ei===selEv?null:ei);}}>
                                <td style={{color:'var(--dim2)'}}>{ei+1}</td>
                                <td style={{color:'var(--dim3)'}}>{ev.ts&&ev.ts.split(' ')[1]?ev.ts.split(' ')[1].substring(0,8):'—'}</td>
                                <td style={{color:'var(--dim3)'}}>{ev.nPkts}</td>
                                <td style={{color:d0<0?'var(--neg)':'var(--pos)'}}>{d0.toFixed(2)}</td>
                                <td style={{color:d2>0?'var(--pos)':'var(--neg)'}}>{d2.toFixed(2)}</td>
                                <td style={{color:d5>0?'var(--pos)':'var(--neg)'}}>{d5.toFixed(2)}</td>
                                <td style={{color:ev.magPct<-2?'var(--neg)':ev.magPct>5?'var(--pos)':'var(--dim3)'}}>{ev.magPct.toFixed(1)}%</td>
                                <td style={{color:'#b07800'}}>{ev.maxSNRall.toFixed(1)}</td>
                                <td style={{color:'var(--dim3)'}}>{ev.cog!==null?Math.round(ev.cog)+'°':'—'}</td>
                                <td style={{fontSize:10,color:ev.labBest&&ev.labBest.cos>=proc.labCosMin?'var(--text)':'var(--dim)'}}>
                                  {ev.labBest?ev.labBest.material.substring(0,14)+' '+ev.labBest.cos.toFixed(2):'—'}{ev.labConflict?' ⚠':''}</td>
                                <td><span className={'badge '+badgeClass(cls)}>{cls}</span></td>
                                <td><div className="conf-bar"><div className="conf-fill" style={{width:Math.max(4,conf*0.8)+'px',background:cc}}/><span className="conf-text">{conf}%</span></div></td>
                                <td style={{fontSize:9,color:'var(--dim2)'}}>{src}</td>
                                <td>{ld?<span className="spinner"/>:<button className="btn btn-ai btn-sm" style={{padding:'2px 7px',fontSize:9}}
                                  onClick={function(e){e.stopPropagation();doAI(activeIdx,ei);}} disabled={!apiKey||!!aiLoading}>AI</button>}</td>
                              </tr>);
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>)}
            </div>)}

          {mainTab==='map' && (
            <div style={{display:'flex',gap:10,height:560,alignItems:'stretch'}}>
              <div style={{width:210,flexShrink:0,display:'flex',flexDirection:'column',gap:8,overflowY:'auto'}}>
                <div className="map-controls-panel">
                  <div className="sidebar-label">Base Layer</div>
                  <div className="layer-btn-group" style={{flexDirection:'column'}}>
                    {[['satellite','Satellite'],['noaa','NOAA ENC'],['topo','Topo'],['street','Street']].map(function(p){
                      return <button key={p[0]} className={mapLayer===p[0]?'layer-btn active':'layer-btn'} onClick={function(){setMapLayer(p[0]);}}>{p[1]}</button>;})}
                  </div>
                </div>
                <div className="map-controls-panel">
                  <div className="sidebar-label">Display</div>
                  <button className={showLines?'layer-btn active':'layer-btn'} onClick={function(){setShowLines(!showLines);}}>Track Lines</button>
                  <button className={showHotspots?'layer-btn active':'layer-btn'} onClick={function(){setShowHotspots(!showHotspots);}}>Target sites</button>
                  <button className={showWps?'layer-btn active':'layer-btn'} onClick={function(){setShowWps(!showWps);}}>Waypoints ▲</button>
                  <button className={proc.applyLayback?'layer-btn active':'layer-btn'} onClick={function(){setProc({applyLayback:!proc.applyLayback});}}>
                    Layback corr. ({fmt(proc.laybackM)} m)</button>
                  {mapFocus && <button className="layer-btn" onClick={function(){setMapFocus(null);}}>Fit all</button>}
                </div>
                {nField>0 && (
                  <div className="map-controls-panel">
                    <div className="sidebar-label">Files
                      <button onClick={function(){setVisibleFiles(null);}} style={{marginLeft:6,background:'none',border:'none',color:'var(--accent)',cursor:'pointer',fontSize:9}}>all</button>
                      <button onClick={function(){setVisibleFiles([]);}} style={{marginLeft:4,background:'none',border:'none',color:'var(--dim)',cursor:'pointer',fontSize:9}}>none</button></div>
                    <div className="file-sel-list">
                      {files.map(function(f,fi){
                        if(f.type!=='field')return null;
                        var col=RUN_COLORS[fi%RUN_COLORS.length];runGroups.forEach(function(g){if(g.fileIds.indexOf(fi)>=0)col=g.color;});
                        var checked=!visibleFiles||visibleFiles.indexOf(fi)>=0;
                        return (
                          <div key={fi} className="file-sel-row" onClick={function(){setVisibleFiles(function(prev){
                            var base=prev?prev.slice():files.map(function(_,i){return i;}).filter(function(i){return files[i].type==='field';});
                            return base.indexOf(fi)>=0?base.filter(function(i){return i!==fi;}):base.concat([fi]);});}}>
                            <input type="checkbox" className="file-sel-check" readOnly checked={checked} style={{accentColor:col}}/>
                            <div style={{width:10,height:10,borderRadius:2,background:col,flexShrink:0}}/>
                            <span style={{fontFamily:'var(--font-mono)',fontSize:9,color:'var(--dim3)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{(f.run||'').substring(0,18)}</span>
                          </div>);})}
                    </div>
                  </div>)}
                {showHotspots && sites.length>0 && (

          {mainTab==='lab' && (
            <div>
              <div className="section">
                <h3>Lab reference signatures ({labSigs.length})</h3>
                <div className="note">Field events are compared with these signatures using a <b>weighted spectral angle</b> (Kruse et al. 1993). This measures how alike the phase-deviation spectra are in shape, regardless of amplitude, because amplitude depends on target size, burial and streamer height. Tag a <b>Seawater blank</b> run for each transmit frequency; it is subtracted from every sample signature, matching how field deviations are measured against background.</div>
                {!labSigs.length && <div className="warnbox">No references yet. Load a lab <code>_p.txt</code> file, pick its material below and click <b>Use as reference</b>.</div>}
                {labSigs.length>0 && (
                  <table className="mt"><thead><tr><th>Material</th><th>xmt</th><th>Run</th><th className="num">N</th>{getHarms(4).map(function(h,k){return <th key={k} className="num">H{k+1}</th>;})}<th>Stored</th><th/></tr></thead>
                    <tbody>{labSigs.map(function(s,i){return (
                      <tr key={i}><td style={{color:MAT_COLORS[s.material]||'var(--text)',fontWeight:700}}>{s.material}</td><td>{s.xmt}Hz</td>
                        <td>{(s.run||'').substring(0,20)}</td><td className="num">{s.n}</td>
                        {getHarms(s.xmt).map(function(h,k){var j=s.freqs.indexOf(h);return <td key={k} className="num">{j>=0?fmt(s.mean[j],2):'—'}</td>;})}

                        <td><button onClick={function(){removeLabSig(s);}} style={{background:'none',border:'none',color:'var(--neg)',cursor:'pointer'}}>×</button></td></tr>);})}
                    </tbody></table>)}
              </div>
              {!af && <div className="empty"><div className="icon">🔬</div><p>Load a lab <code>_p.txt</code> file</p></div>}
              {af && !af.isLab && <div className="empty" style={{height:120}}><p>Select a lab file from the sidebar to view its statistics</p></div>}
              {af && af.isLab && (
                <div className="section">
                  <div style={{fontFamily:'var(--font-mono)',fontSize:12,fontWeight:700,marginBottom:3}}>{af.run}</div>
                  <div style={{fontFamily:'var(--font-mono)',fontSize:10,color:'var(--dim2)',marginBottom:8}}>{af.labStats.length} xmt group{af.labStats.length!==1?'s':''} · {af.nPkts} packets · col[0]=freq · col[1]=ch1-0 Δφ rad · col[9]=ch1 mag · std ddof=1</div>
                  {af.labStats.map(function(grp){

                        <div className="row" style={{borderBottom:'1px solid var(--border)',paddingBottom:6,marginBottom:6}}>

                          <select className="confirm-sel" style={{flex:'0 0 180px'}} value={sel} onChange={function(e){var v=e.target.value;setLabTag(function(p){var n=Object.assign({},p);n[k]=v;return n;});}}>

                            <tbody>{grp.rows.map(function(row){var isH=getHarms(grp.xmt).indexOf(row.freq)>=0;return (
