                    onDragLeave={function(e){if(!e.currentTarget.contains(e.relatedTarget))setDragOver(null);}}
                    onDrop={function(e){e.preventDefault();setDragOver(null);var ids=[];try{ids=JSON.parse(e.dataTransfer.getData('text/plain'));}catch(x){}
                      if(Array.isArray(ids)&&ids.length)moveFiles(ids,g.id);}}>
                    <div className="run-group-hdr" onClick={function(){setCollapsed(function(p){var n=Object.assign({},p);n[g.id]=!isCol;return n;});}}>
                      <span style={{fontSize:9,color:'var(--dim2)',width:8}}>{isCol?'▸':'▾'}</span>
                      <div className="run-swatch" style={{background:g.color}}/>
                      <span className="run-group-name" title="Double-click to rename" onDoubleClick={function(e){e.stopPropagation();renameGroup(g);}}>{g.name}</span>
                      <span style={{fontSize:9,color:'var(--dim)'}}>{g.fileIds.length}</span>
                      {g.fileIds.length>0 && <input type="checkbox" title="Select all lines in this group" checked={allSel} onClick={function(e){e.stopPropagation();}}
                        onChange={function(e){var v=e.target.checked;setSelFiles(function(p){var n=Object.assign({},p);g.fileIds.forEach(function(fi){if(v)n[fi]=true;else delete n[fi];});return n;});}}/>}
                      <button title="Rename" onClick={function(e){e.stopPropagation();renameGroup(g);}} style={{background:'none',border:'none',color:'var(--dim2)',cursor:'pointer',fontSize:10,padding:'0 1px'}}>✎</button>
                      <button title="Show this group on the map" onClick={function(e){e.stopPropagation();setMapGroup(g.id);setVisibleFiles(g.fileIds.slice());setStepIdx(-1);setMainTab('map');}}
                        style={{background:'none',border:'none',color:'var(--accent)',cursor:'pointer',fontSize:11,padding:'0 1px'}}>⌖</button>
                      {!g.auto && <button title="Delete group (lines return to their day group)" onClick={function(e){e.stopPropagation();deleteCustomGroup(g);}} style={{background:'none',border:'none',color:'var(--neg)',cursor:'pointer',fontSize:13,padding:'0 1px'}}>×</button>}
                    </div>
                    {!isCol && (
                      <div className="run-group-body" style={{gap:3}}>
                        {g.fileIds.map(function(fi){return files[fi]?fileRow(files[fi],fi,g):null;})}
                        {!g.fileIds.length && <div style={{fontSize:10,color:'var(--dim)',fontFamily:'var(--font-mono)',padding:'6px 4px',border:'1px dashed var(--border2)',borderRadius:3,textAlign:'center'}}>Drop lines here</div>}
                      </div>)}
                  </div>);
              })}
              {(Object.keys(groupAssign).length>0||customGroups.length>0) && <button className="btn btn-ghost btn-sm" onClick={resetGroups}>Reset to day groups</button>}
              {labIdx.length>0 && <div className="sidebar-label" style={{marginTop:4}}>Lab files ({labIdx.length})</div>}
              {labIdx.map(function(i){return fileRow(files[i],i,null);})}
            </div>);
          })()}

          {/* Waypoints */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:4}}>
            <span className="sidebar-label">Known waypoints ({wps.length})</span>
            <button className="btn btn-ghost btn-sm" onClick={function(){wpRef.current&&wpRef.current.click();}}>Load</button>
          </div>
          {wps.length>0 && (
            <div>
              <div style={{display:'flex',flexDirection:'column',gap:2,maxHeight:90,overflowY:'auto'}}>
                {wps.map(function(w,i){return (
                  <div key={i} style={{display:'flex',gap:5,alignItems:'center',fontSize:10,fontFamily:'var(--font-mono)',padding:'2px 5px',background:'var(--panel2)',borderRadius:2}}>
                    <span style={{color:'#b08800'}}>▲</span><span style={{fontWeight:700}}>{w.name}</span>
                    <span style={{flex:1,color:'var(--dim)',fontSize:9,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{w.material||''}{w.flipped?' (lon→W)':''}</span>
                    {!w.id && <span title="not saved to DB" style={{color:'var(--dim)',fontSize:9}}>local</span>}
                  </div>);})}
              </div>
              <div className="row" style={{marginTop:4}}>
                {waypoints.some(function(w){return !w.id;}) && <button className="btn btn-ghost btn-sm" onClick={function(){
                  var loc=waypoints.filter(function(w){return !w.id;});
                  saveWaypointsDB(IPA.alignWaypointHemisphere(loc,refLon)).then(function(d){
                    setWaypoints(function(p){return p.filter(function(w){return w.id;}).concat(d.map(function(r){return{id:r.id,name:r.name,lat:r.lat,lon:r.lon,material:r.material,source:r.source};}));});
                  }).catch(function(e){alert('Could not save waypoints: '+e.message+'\nRun supabase_schema.sql in Supabase first.');});
                }}>Save to DB</button>}
                <button className="btn btn-ghost btn-sm" onClick={function(){
                  var ids=waypoints.filter(function(w){return w.id;}).map(function(w){return w.id;});
                  if(ids.length&&!window.confirm('Also delete '+ids.length+' shared waypoints from the database?')){setWaypoints(function(p){return p.filter(function(w){return w.id;});});return;}
                  if(ids.length)deleteWaypointsDB(ids).catch(function(e){console.warn(e);});
                  setWaypoints([]);
                }}>Clear</button>
              </div>
            </div>)}

          {/* Processing */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:4,cursor:'pointer'}} onClick={function(){setShowProc(!showProc);}}>
            <span className="sidebar-label">Processing {showProc?'▾':'▸'}</span>
            <span className="pill">{proc.mode}</span>
          </div>
          {showProc && (
            <div className="param-grid">
              <div className="param" style={{gridColumn:'1/-1'}}><label>Detection mode</label>
                <select value={proc.mode} onChange={function(e){setProc({mode:e.target.value});}}>
                  <option value="robust">Robust (detrended, multi-harmonic)</option>
                  <option value="legacy">Legacy (fundamental 3σ, fixed background)</option>
                </select></div>
              {proc.mode==='robust' && <Num label="Detrend window (pkts)" value={proc.detrendWin} onChange={function(v){setProc({detrendWin:Math.max(5,Math.round(v))});}}/>}
              {proc.mode==='robust' && <Num label="z threshold" step={0.5} value={proc.zThresh} onChange={function(v){setProc({zThresh:v});}}/>}
              {proc.mode==='robust' && <Num label="Harmonic hits" value={proc.minHarmHits} onChange={function(v){setProc({minHarmHits:Math.max(1,Math.round(v))});}}/>}
              {proc.mode==='robust' && <Num label="Gap (pkts)" value={proc.gapPkts} onChange={function(v){setProc({gapPkts:Math.max(0,Math.round(v))});}}/>}
              {proc.mode==='robust' && <Num label="Min pkts / event" value={proc.minPkts} onChange={function(v){setProc({minPkts:Math.max(1,Math.round(v))});}}/>}
              <Num label="Merge crossing gaps ≤ (m)" value={proc.mergeGapM} onChange={function(v){setProc({mergeGapM:Math.max(0,v)});}}/>
              <Num label="Lab match cos ≥" step={0.01} value={proc.labCosMin} onChange={function(v){setProc({labCosMin:v});}}/>
              <button className="btn btn-ghost btn-sm" style={{gridColumn:'1/-1'}} onClick={function(){setProc(Object.assign({},IPA.DEFAULT_PROC,{laybackM:proc.laybackM,latencyS:proc.latencyS,applyLayback:proc.applyLayback}));}}>Reset detection defaults</button>
            </div>)}

          {training.length>0 && (
            <div>
              <div className="sep" style={{height:1,width:'100%',background:'var(--border)',margin:'4px 0'}}/>
              <div className="sidebar-label">Training ({eligibleTraining.length} in use / {training.length})</div>
              <div style={{display:'flex',flexDirection:'column',gap:3,maxHeight:100,overflowY:'auto'}}>
                {training.map(function(t,i){return (
                  <div key={i} title={(t.cohort==='legacy'?'Legacy v26 confirmation (raw-phase features, no AI)':'v27+ confirmation'+(t.aiUsed?' · AI reviewed':''))+(t.excluded?' · excluded':'')}
                    style={{display:'flex',alignItems:'center',gap:5,padding:'3px 5px',borderRadius:2,background:'var(--panel2)',fontSize:10,fontFamily:'var(--font-mono)',
                    opacity:eligibleTraining.indexOf(t)>=0?1:.45}}>
                    <div style={{width:7,height:7,borderRadius:'50%',flexShrink:0,background:MAT_COLORS[t.material]||'#8099b0'}}/>
                    <span style={{fontWeight:700,color:MAT_COLORS[t.material]||'var(--dim2)'}}>{t.material}</span>
                    <span style={{flex:1,fontSize:9,color:'var(--dim)',marginLeft:4}}>{(t.run||'').substring(0,10)}</span>
                    {t.cohort==='legacy' && <span className="pill" style={{fontSize:8,padding:'0 4px'}}>v26</span>}
                    {t.aiUsed && <span className="pill" style={{fontSize:8,padding:'0 4px'}}>AI</span>}
                    <button title={t.excluded?'Include again':'Exclude from training'} onClick={function(){toggleExcluded([t],!t.excluded);}}
                      style={{background:'none',border:'none',color:t.excluded?'var(--neg)':'var(--dim)',cursor:'pointer',fontSize:10,padding:'0 2px'}}>⊘</button>
                    <button onClick={function(){setTraining(function(p){return p.filter(function(_,j){return j!==i;});});if(t.id)deleteTrainingFromDB(t.id).catch(function(e){console.warn(e);});}}
                      style={{background:'none',border:'none',color:'var(--dim)',cursor:'pointer',fontSize:11,padding:'0 2px'}}>×</button>
                  </div>);})}
              </div>
            </div>)}
          {files.length>0 && (
            <button className="btn btn-ghost btn-sm" onClick={function(){setFiles([]);setActiveIdx(null);setAiResults({});setSelEv(null);setSelFiles({});setVisibleFiles(null);setMapGroup('all');setStepIdx(-1);idbClearFiles();}}>Clear all files</button>)}
        </div>

        <div className="content">
          <div className="tab-row" style={{margin:'-14px -14px 0',padding:'0 14px'}}>
            {[['analysis','Analysis'],['map','Map'],['lab','Lab Stats'],['layback','Layback'],['metrics','Metrics'],['library','Data Library ('+library.length+')']].map(function(t){
              return <div key={t[0]} className={mainTab===t[0]?'tab active':'tab'} onClick={function(){setMainTab(t[0]);if(t[0]!=='map')setMapFocus(null);}}>{t[1]}</div>;})}
          </div>

          {mainTab==='analysis' && (
            <div>
              {!af && <div className="empty"><div className="icon">◎</div><p>Load <code>_p.txt</code> files to begin</p></div>}
              {af && af.isLab && <div className="empty"><div className="icon">🔬</div><p>Lab file selected — tag it as a reference in the <strong>Lab Stats</strong> tab</p></div>}
              {af && !af.isLab && (
                <div>
                  <div className="statsbar">
                    <Tile label="Run" small value={af.pkts[0]?af.pkts[0].run.substring(0,16):''} sub={af.pkts.length+'pkt · '+af.xmt+'Hz'}/>
                    <Tile label={af.bg.mode==='robust'?'BG Δφ median':'BG Δφ mean'} value={af.bg.mean.toFixed(3)} sub={'mrad at '+af.xmt+'Hz'}/>
                    <Tile label={af.bg.mode==='robust'?'Noise σ (MAD)':'BG std dev'} value={af.bg.std.toFixed(3)} sub={af.bg.mode==='robust'?'detrended, 1.4826·MAD':'mrad ddof=1'}/>
                    <Tile label={af.bg.mode==='robust'?af.T+'σ band':'3σ threshold'} value={af.bg.mode==='robust'?'±'+(af.T*af.bg.std).toFixed(2):(af.bg.mean-3*af.bg.std).toFixed(2)}
                      sub={af.bg.mode==='robust'?'around running median':(af.bg.mean+3*af.bg.std).toFixed(2)+' mrad'}/>
                    <Tile label="Events" value={af.events.length} color={af.events.length?'#b07800':'var(--pos)'} sub={af.clusters.reduce(function(a,c){return a+c.length;},0)+' anom pkts'}/>
                  </div>
                  <div className="charts-grid" style={{marginTop:8}}>
                    <div className="chart-panel full">
                      <div className="chart-title">Δφ {af.xmt}Hz ch1-0 (mrad) — {af.bg.mode==='robust'?'running-median baseline ± '+af.T+'σ':'3σ threshold'}<span>shaded = events</span></div>
                      <canvas ref={tsRef} style={{height:110}} height={110}/>
                    </div>
                    <div className="chart-panel">
                      <div className="chart-title">Δφ {af.harms[2]}Hz (amber) · {af.harms[5]}Hz (green)</div>
                      <canvas ref={highRef} style={{height:100}} height={100}/>
                    </div>
                    <div className="chart-panel">
                      <div className="chart-title">Deviation spectrum — event {selEv!==null?selEv+1:'1'}
                        <span style={{fontSize:9}}>{activeEv&&activeEv.labBest?'dashed = '+activeEv.labBest.material+' (lab, scaled)':''}</span></div>
                      <canvas ref={specRef} style={{height:100}} height={100}/>
                    </div>
                    <div className="chart-panel full">
                      <div className="chart-title">Ch1 magnitude at {af.xmt}Hz (counts)</div>
                      <canvas ref={magRef} style={{height:75}} height={75}/>
                    </div>
                  </div>
                  <div className="chart-panel full" style={{padding:'8px 0 0',marginTop:8}}>
                    <div className="chart-title" style={{padding:'0 10px 7px',display:'flex',alignItems:'center',gap:8}}>
                      <span>Events — {af.events.length}</span>
                      <span style={{color:'var(--dim)',flex:1,fontSize:9}}>deviations from local background · click row for spectrum</span>
                      <button className="btn btn-ai btn-sm" onClick={doAIAll} disabled={!apiKey||!af.events.length||!!aiLoading}>{aiLoading?'Running...':'⚡ AI All'}</button>
                    </div>
                    <div className="events-wrap">
                      <table className="events-table">
                        <thead><tr>
                          <th>#</th><th>Time</th><th>Pkts</th><th>dev {af.harms[0]}Hz</th><th>dev {af.harms[2]}Hz</th><th>dev {af.harms[5]}Hz</th>
                          <th>Mag%</th><th>SNR</th><th>Hdg</th><th>Lab match</th><th>Class</th><th>Conf</th><th>Src</th><th>AI</th>
                        </tr></thead>
                        <tbody>
                          {af.events.map(function(ev,ei){
                            var ak=activeIdx+'-'+ei,ar=aiResults[ak],ld=aiLoading===ak;
                            var cls=finalCls(activeIdx,ei,ev),conf=finalConf(activeIdx,ei,ev);
                            var cc=conf>75?'var(--pos)':conf>50?'#b07800':'var(--neg)';
                            var d0=ev.dpDev[af.harms[0]]||0,d2=ev.dpDev[af.harms[2]]||0,d5=ev.dpDev[af.harms[5]]||0;
                            var src=ar&&ar.classification!=='Error'?'AI':ev.fusedSrc;
                            return (
                              <tr key={ei} className={selEv===ei?'selected':''} style={{cursor:'pointer'}} onClick={function(){setSelEv(ei===selEv?null:ei);}}>
                                <td style={{color:'var(--dim2)'}}>{ei+1}</td>
                                <td style={{color:'var(--dim3)'}}>{ev.ts&&ev.ts.split(' ')[1]?ev.ts.split(' ')[1].substring(0,8):'—'}</td>
                                <td style={{color:'var(--dim3)'}}>{ev.nPkts}</td>
                                <td style={{color:d0<0?'var(--neg)':'var(--pos)'}}>{d0.toFixed(2)}</td>
                                <td style={{color:d2>0?'var(--pos)':'var(--neg)'}}>{d2.toFixed(2)}</td>
                                <td style={{color:d5>0?'var(--pos)':'var(--neg)'}}>{d5.toFixed(2)}</td>
                                <td style={{color:ev.magPct<-2?'var(--neg)':ev.magPct>5?'var(--pos)':'var(--dim3)'}}>{ev.magPct.toFixed(1)}%</td>
                                <td style={{color:'#b07800'}}>{ev.maxSNRall.toFixed(1)}</td>
                                <td style={{color:'var(--dim3)'}}>{ev.cog!==null?Math.round(ev.cog)+'°':'—'}</td>
                                <td style={{fontSize:10,color:ev.labBest&&ev.labBest.cos>=proc.labCosMin?'var(--text)':'var(--dim)'}}>
                                  {ev.labBest?ev.labBest.material.substring(0,14)+' '+ev.labBest.cos.toFixed(2):'—'}{ev.labConflict?' ⚠':''}</td>
                                <td><span className={'badge '+badgeClass(cls)}>{cls}</span></td>
                                <td><div className="conf-bar"><div className="conf-fill" style={{width:Math.max(4,conf*0.8)+'px',background:cc}}/><span className="conf-text">{conf}%</span></div></td>
                                <td style={{fontSize:9,color:'var(--dim2)'}}>{src}</td>
                                <td>{ld?<span className="spinner"/>:<button className="btn btn-ai btn-sm" style={{padding:'2px 7px',fontSize:9}}
                                  onClick={function(e){e.stopPropagation();doAI(activeIdx,ei);}} disabled={!apiKey||!!aiLoading}>AI</button>}</td>
                              </tr>);
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>)}
            </div>)}

          {mainTab==='map' && (
            <div style={{display:'flex',gap:10,height:560,alignItems:'stretch'}}>
              <div style={{width:210,flexShrink:0,display:'flex',flexDirection:'column',gap:8,overflowY:'auto'}}>
                <div className="map-controls-panel">
                  <div className="sidebar-label">Base Layer</div>
                  <div className="layer-btn-group" style={{flexDirection:'column'}}>
                    {[['satellite','Satellite'],['noaa','NOAA ENC'],['topo','Topo'],['street','Street']].map(function(p){
                      return <button key={p[0]} className={mapLayer===p[0]?'layer-btn active':'layer-btn'} onClick={function(){setMapLayer(p[0]);}}>{p[1]}</button>;})}
                  </div>
                </div>
                <div className="map-controls-panel">
                  <div className="sidebar-label">Display</div>
                  <button className={showLines?'layer-btn active':'layer-btn'} onClick={function(){setShowLines(!showLines);}}>Track Lines</button>
                  <button className={showHotspots?'layer-btn active':'layer-btn'} onClick={function(){setShowHotspots(!showHotspots);}}>Target sites</button>
                  <button className={showWps?'layer-btn active':'layer-btn'} onClick={function(){setShowWps(!showWps);}}>Known targets ▲ ({targets.length})</button>
                  <button className={proc.applyLayback?'layer-btn active':'layer-btn'} onClick={function(){setProc({applyLayback:!proc.applyLayback});}}>
                    Layback corr. ({fmt(proc.laybackM)} m)</button>
                  {mapFocus && <button className="layer-btn" onClick={function(){setMapFocus(null);}}>Fit all</button>}
                </div>
                {nField>0 && (function(){
                  var gIds=mapGroup==='all'?fieldIdx:((allGroups.find(function(g){return g.id===mapGroup;})||{fileIds:fieldIdx}).fileIds);
                  function step(d){if(!gIds.length)return;var k=stepIdx<0?(d>0?0:gIds.length-1):(stepIdx+d+gIds.length)%gIds.length;
                    setStepIdx(k);setVisibleFiles([gIds[k]]);setActiveIdx(gIds[k]);}
                  return (
                  <div className="map-controls-panel">
                    <div className="sidebar-label">Group / day</div>
                    <select className="confirm-sel" value={mapGroup} onChange={function(e){var id=e.target.value;setMapGroup(id);setStepIdx(-1);
                      var g=allGroups.find(function(x){return x.id===id;});setVisibleFiles(id==='all'||!g?null:g.fileIds.slice());}}>
                      <option value="all">All lines</option>
                      {allGroups.map(function(g){return <option key={g.id} value={g.id}>{g.name} ({g.fileIds.length})</option>;})}
                    </select>
                    <div className="row" style={{gap:4}}>
                      <button className="layer-btn" onClick={function(){step(-1);}}>◀</button>
                      <span style={{fontSize:9,flex:1,textAlign:'center'}}>{stepIdx<0?'all '+gIds.length+' lines':(stepIdx+1)+'/'+gIds.length+' '+((files[gIds[stepIdx]]||{}).run||'')}</span>
                      <button className="layer-btn" onClick={function(){step(1);}}>▶</button>
                    </div>
                    {stepIdx>=0 && <button className="layer-btn" onClick={function(){setStepIdx(-1);setVisibleFiles(mapGroup==='all'?null:gIds.slice());}}>Show whole group</button>}
                  </div>);})()}
                {nField>0 && (
                  <div className="map-controls-panel">
                    <div className="sidebar-label">Files
                      <button onClick={function(){setVisibleFiles(null);}} style={{marginLeft:6,background:'none',border:'none',color:'var(--accent)',cursor:'pointer',fontSize:9}}>all</button>
                      <button onClick={function(){setVisibleFiles([]);}} style={{marginLeft:4,background:'none',border:'none',color:'var(--dim)',cursor:'pointer',fontSize:9}}>none</button></div>
                    <div className="file-sel-list">
                      {files.map(function(f,fi){
                        if(f.type!=='field')return null;
                        var gg=groupOf(fi),col=gg?gg.color:RUN_COLORS[fi%RUN_COLORS.length];
                        var checked=!visibleFiles||visibleFiles.indexOf(fi)>=0;
                        return (
                          <div key={fi} className="file-sel-row" onClick={function(){setVisibleFiles(function(prev){
                            var base=prev?prev.slice():files.map(function(_,i){return i;}).filter(function(i){return files[i].type==='field';});

                <h3>Layback calibration — linear, along the boat's path</h3>
                <div className="note">The sensor is towed behind the GPS antenna and <b>follows the boat's own path</b>, so the offset is measured as a distance along the recorded track. It is never projected along a noisy heading. For every line that passes a known target, the app finds the boat's closest approach and the strongest crossing after it. The distance between them along the path is the measured offset:
                  <br/><code>along = L + τ·v + b<sub>target</sub>·dir</code><br/>
                  <b>L</b> is the offset at zero speed (antenna → tie-down → sensor). <b>τ</b> (s) captures everything that grows with speed: timing latency, the half-packet timestamp and cable lift. <b>b</b> is that target's waypoint position error along the line; it flips sign on opposite-heading passes, so reciprocal lines separate it from L. It is solved by ordinary least squares with 3σ outlier rejection. The GPS track is smoothed (±5 fixes) before measuring distance, so position jitter doesn't inflate it.</div>

                  <button className="btn btn-ghost btn-sm" disabled={!sites.length} onClick={function(){downloadCSV('ipa_sites.csv',sites.map(function(s,i){return{site:i+1,tier:s.tier,class:s.cls,lat:s.lat.toFixed(7),lon:s.lon.toFixed(7),
                    detections:s.nDet,runs_detected:s.nRuns,runs_passed:s.nPass,repeatability:s.repeatability.toFixed(2),reciprocal:s.reciprocal,consensus:s.consensus.toFixed(2),
                    family_consensus:s.famConsensus.toFixed(2),scatter_m:s.scatterM.toFixed(1),mean_snr:s.meanSNR.toFixed(1),nearest_wp:s.nearestWp||'',nearest_wp_m:s.nearestWpM!==null?s.nearestWpM.toFixed(1):'',runs:Object.values(s.runs).join(' | ')};}));}}>Export CSV</button>
                </h3>
                <div className="note">Detections from every loaded field run are grouped when their {proc.applyLayback?'layback-corrected':'raw'} positions fall within <b>{proc.mergeRadiusM} m</b> of each other. <b>Repeatability</b> = runs that detected the site ÷ runs whose sensor track passed within {Math.max(proc.mergeRadiusM,proc.passRadiusM)} m. <b>Confirmed</b> = detected on ≥3 runs, including opposite headings, with ≥67% agreement on material family. Reciprocal detections rule out along-track artefacts from layback or timing. <b>Corroborated</b> = ≥2 runs agreeing on family. <b>Conflicting</b> = ≥2 runs that disagree on family.</div>
                <div className="param-grid" style={{gridTemplateColumns:'repeat(3,1fr)',marginBottom:10}}>
                  <Num label="Merge radius (m)" value={proc.mergeRadiusM} onChange={function(v){setProc({mergeRadiusM:v});}}/>
                  <Num label="Pass radius (m)" value={proc.passRadiusM} onChange={function(v){setProc({passRadiusM:v});}}/>
                  <Num label="Detection radius vs waypoint (m)" value={proc.detRadiusM} onChange={function(v){setProc({detRadiusM:v});}}/>
                </div>
                {!sites.length && <div className="warnbox">Load two or more field runs over the same area to see corroboration.</div>}
                {sites.length>0 && (
                  <div>
                    <div className="tiles">
                      <Tile label="Sites" value={sites.length} sub={points.length+' detections · '+nField+' runs'}/>
                      <Tile label="Confirmed" value={tiersCount['Confirmed']||0} color="var(--pos)" sub="≥3 runs, reciprocal"/>
                      <Tile label="Corroborated" value={tiersCount['Corroborated']||0} sub="≥2 runs agree"/>
                      <Tile label="Conflicting" value={tiersCount['Conflicting']||0} color="var(--neg)" sub="class disagrees"/>
                      <Tile label="Single run" value={(tiersCount['Single run']||0)+(tiersCount['Weak repeat']||0)} sub={(tiersCount['Weak repeat']||0)+' weak repeats'}/>
                      <Tile label="Mean repeatability" value={pct(IPA.mean(multi.map(function(s){return s.repeatability;})))} sub="multi-run sites"/>
                      <Tile label="Mean scatter" value={fmt(IPA.mean(multi.map(function(s){return s.scatterM;})))+' m'} sub="RMS about centroid"/>
                    </div>
                    <div style={{maxHeight:320,overflowY:'auto'}}>
                      <table className="mt"><thead><tr><th>#</th><th>Tier</th><th>Class</th><th className="num">Runs</th><th className="num">Passed</th><th className="num">Repeat.</th><th>Recip.</th><th className="num">Consensus</th><th className="num">Scatter m</th><th className="num">SNR</th><th>Nearest target</th><th/></tr></thead>
                        <tbody>{sites.map(function(s,i){return (
                          <tr key={i}><td>{i+1}</td><td><span className={tierCls(s.tier)}>{s.tier}</span></td><td><span className={'badge '+badgeClass(s.cls)}>{s.cls}</span></td>
                            <td className="num">{s.nRuns}</td><td className="num">{s.nPass}</td><td className="num">{pct(s.repeatability)}</td><td>{s.reciprocal?'✓':''}</td>
                            <td className="num">{pct(s.consensus)}</td><td className="num">{fmt(s.scatterM)}</td><td className="num">{fmt(s.meanSNR)}</td>
                            <td>{s.nearestWp?s.nearestWp+' @ '+fmt(s.nearestWpM)+' m':'—'}</td>
                            <td><button className="btn btn-ghost btn-sm" style={{padding:'1px 6px'}} onClick={function(){setMapFocus([s.lat,s.lon]);setMainTab('map');}}>map</button></td></tr>);})}</tbody></table>
                    </div>
                  </div>)}
              </div>

              <div className="section">
                <h3>Known-target coverage
                  <div style={{flex:1}}/>
                  <label style={{fontSize:10,textTransform:'none',letterSpacing:0,display:'flex',gap:4,alignItems:'center',color:'var(--dim3)'}}>
                    <input type="checkbox" checked={!!proc.dayFilter} onChange={function(e){setProc({dayFilter:e.target.checked});}}/> match deploy-day codes</label>
                  {coverage && <button className="btn btn-ghost btn-sm" onClick={function(){downloadCSV('ipa_coverage.csv',coverage.rows.map(function(r){return{line:r.run,day:r.dayRank,target:r.target,status:r.status,
                    closest_track_m:r.closest!==null?r.closest.toFixed(1):'',detection_dist_m:r.evDist!==null?fmt(r.evDist,1):'',class:r.cls,snr:r.snr!==null?fmt(r.snr,1):''};}));}}>Export CSV</button>}
                </h3>
                {!coverage && <div className="warnbox">Needs known waypoints and field lines. Calibrate and apply the layback first so positions line up.</div>}
                {coverage && (
                  <div>
                    <div className="note">Uses <b>corrected</b> positions. <b>PASS</b> = a line's sensor track came within {proc.detRadiusM} m of a target. <b>HIT</b> = a crossing was detected within {proc.detRadiusM} m of it; <b>FAIL</b> = passed with nothing detected. Crossings not near any target are <b>unattributed</b>. Those classified as a material (not weak) count as false alarms, which is only meaningful if every real target in the area is in the waypoint file. Waypoints within {proc.targetLinkM} m form one target. With <i>match deploy-day codes</i> on, names like <code>2C-6</code> are only scored against lines from survey day 2 (days are ranked by date among lines near the targets).</div>
                    <div className="tiles">
                      <Tile label="Pd" value={pct(coverage.pd)} sub={coverage.hits+'/'+coverage.passes+' passes'+(coverage.pdCI?' · CI '+pct(coverage.pdCI[0])+'–'+pct(coverage.pdCI[1]):'')}/>
                      <Tile label="Missed passes" value={coverage.passes-coverage.hits} color={coverage.passes-coverage.hits?'var(--neg)':'var(--pos)'} sub="FAIL rows"/>
                      <Tile label="False alarms" value={coverage.falseAlarms} color={coverage.falseAlarms?'#b07800':'var(--pos)'} sub={fmt(coverage.faPerKm,2)+' per km · '+fmt(coverage.trackKm,2)+' km'}/>
                      <Tile label="Unattributed" value={coverage.unattributed} sub="incl. weak"/>
                      <Tile label="Material family acc." value={pct(coverage.famAcc)} sub={coverage.famN+' hits w/ known material'}/>
                      <Tile label="Mean position error" value={fmt(coverage.meanPosErrM)+' m'} sub={proc.applyLayback?'after layback':'raw GPS'}/>
                    </div>
                    <table className="mt"><thead><tr><th>Target</th><th className="num">Day</th><th>Material</th><th className="num">Passes</th><th className="num">Hits</th><th className="num">Pd</th><th className="num">Family OK</th><th className="num">Mean err m</th><th>Classes seen</th></tr></thead>
                      <tbody>{coverage.perTarget.map(function(t){return (
                        <tr key={t.id}><td><b>{t.label}</b></td><td className="num">{t.day||'—'}</td><td>{t.material||'—'}</td><td className="num">{t.passes}</td><td className="num">{t.hits}</td>
                          <td className="num" style={{color:t.passes?(t.hits===t.passes?'var(--pos)':t.hits?'#b07800':'var(--neg)'):'var(--dim)'}}>{pct(t.pd)}</td>
                          <td className="num">{t.famN?t.famOk+'/'+t.famN:'—'}</td><td className="num">{fmt(t.meanErrM)}</td>
                          <td>{Object.keys(t.classes).map(function(c){return c+' ×'+t.classes[c];}).join(', ')||'—'}</td></tr>);})}</tbody></table>
                    <details style={{marginTop:8}}><summary style={{cursor:'pointer',fontSize:11,fontFamily:'var(--font-mono)',color:'var(--dim2)'}}>Every line × target ({coverage.rows.length} rows)</summary>
                      <div style={{maxHeight:300,overflowY:'auto'}}>
                        <table className="mt"><thead><tr><th>Line</th><th className="num">Day</th><th>Target</th><th>Status</th><th className="num">Track closest m</th><th className="num">Det. dist m</th><th>Class</th><th className="num">SNR</th></tr></thead>
                          <tbody>{coverage.rows.map(function(r,i){return (
                            <tr key={i}><td>{r.run}</td><td className="num">{r.dayRank||'—'}</td><td>{r.target}</td>
                              <td style={{fontWeight:700,color:r.status==='HIT'?'var(--pos)':r.status==='FAIL'?'var(--neg)':'var(--dim2)'}}>{r.status}</td>
                              <td className="num">{r.closest!==null?fmt(r.closest):'—'}</td><td className="num">{fmt(r.evDist)}</td><td>{r.cls||'—'}</td><td className="num">{fmt(r.snr)}</td></tr>);})}</tbody></table>
                      </div></details>
                  </div>)}
              </div>

              <div className="section">
                <h3>Training data in use</h3>
                <div className="note">All confirmations stay in the shared database. Only the ones allowed by this policy are fed back into <b>new</b> classifications: they become the Claude AI few-shot examples and the k-NN training set. <b>Legacy</b> confirmations were saved by v26 and earlier. They store <i>raw</i> phase values rather than deviations from the local background, and none of them were AI-reviewed, because the v26 AI call never reached the API. Mixing them in would give the classifier examples on a different feature scale. Use ⊘ in the sidebar to exclude any single confirmation for everyone.</div>
                <div className="row" style={{marginBottom:10}}>
                  <select className="confirm-sel" style={{flex:'0 0 300px'}} value={trainPolicy} onChange={function(e){setTrainPolicy(e.target.value);}}>
                    {Object.keys(TRAIN_POLICIES).map(function(k){return <option key={k} value={k}>{TRAIN_POLICIES[k].label}</option>;})}
                  </select>
                  {cohortCounts.legacy>0 && <button className="btn btn-ghost btn-sm" onClick={function(){
                    var leg=training.filter(function(t){return t.cohort==='legacy'&&!t.excluded;});
                    if(window.confirm('Mark all '+leg.length+' legacy confirmations as excluded for every user? They stay in the database and can be re-included.'))toggleExcluded(leg,true);}}>Exclude all legacy (shared)</button>}
                </div>
                <div className="tiles">
                  <Tile label="In use" value={eligibleTraining.length} color="var(--pos)" sub={'of '+training.length+' confirmations'}/>
                  <Tile label="Current (v27+)" value={cohortCounts.current} sub="deviation features"/>
                  <Tile label="Legacy (v26)" value={cohortCounts.legacy} sub="raw-phase features"/>
                  <Tile label="AI reviewed" value={cohortCounts.ai} sub="AI result at confirm time"/>
                  <Tile label="Excluded" value={cohortCounts.excluded} color={cohortCounts.excluded?'var(--neg)':undefined} sub="manually, shared"/>
                </div>
                {training.length>0 && (function(){
                  var mats={};training.forEach(function(t){var m=mats[t.material]=mats[t.material]||{current:0,legacy:0,use:0};m[t.cohort]++;if(eligibleTraining.indexOf(t)>=0)m.use++;});
                  return (
                    <table className="mt"><thead><tr><th>Material</th><th className="num">Current</th><th className="num">Legacy</th><th className="num">In use</th></tr></thead>
                      <tbody>{Object.keys(mats).sort().map(function(k){return <tr key={k}><td style={{color:MAT_COLORS[k]}}>{k}</td><td className="num">{mats[k].current}</td><td className="num">{mats[k].legacy}</td><td className="num">{mats[k].use}</td></tr>;})}</tbody></table>);
                })()}
              </div>

              <div className="section">
                <h3>Classifier accuracy vs confirmed labels</h3>
                <div className="note">Ground truth = material confirmations in the shared training table. Each new confirmation also stores what the rules, lab match, fused result and AI predicted at the time, so accuracy builds up automatically. <b>LOO k-NN</b> is leave-one-out 3-nearest-neighbour on the stored features. It checks whether confirmed classes form separable clusters, which is a proxy for how well a trained model could do. κ = Cohen's kappa (agreement beyond chance). Family level groups the labels into hydrocarbon, metallic, mixed, artifact and weak.</div>
                <div className="row" style={{marginBottom:10}}>
                  <select className="confirm-sel" style={{flex:'0 0 230px'}} value={metricPred} onChange={function(e){setMetricPred(e.target.value);}}>
                    <option value="fused">Fused rules + lab (stored)</option><option value="rules">Rule engine (stored)</option>
                    <option value="lab">Lab spectral match (stored)</option><option value="ai">Claude AI (stored)</option><option value="knn">LOO k-NN on training features</option>
                  </select>
                  <select className="confirm-sel" style={{flex:'0 0 150px'}} value={metricLevel} onChange={function(e){setMetricLevel(e.target.value);}}>
                    <option value="family">Family level</option><option value="material">Material level</option>
                  </select>
                </div>
                {!accuracy.n && <div className="warnbox">No confirmations with this prediction stored yet ({training.length} total confirmations). Older rows were saved before predictions were recorded; confirm new events in the Analysis tab{metricPred!=='knn'?' or try LOO k-NN':''}.</div>}
                {accuracy.n>0 && (
                  <div>
                    <div className="tiles">
                      <Tile label="Accuracy" value={pct(accuracy.accuracy)} sub={'n='+accuracy.n+(accuracy.accCI?' · CI '+pct(accuracy.accCI[0])+'–'+pct(accuracy.accCI[1]):'')}/>
                      <Tile label="Cohen's κ" value={fmt(accuracy.kappa,2)} sub={accuracy.kappa>0.8?'almost perfect':accuracy.kappa>0.6?'substantial':accuracy.kappa>0.4?'moderate':accuracy.kappa>0.2?'fair':'slight'}/>
                      <Tile label="Macro F1" value={fmt(accuracy.macroF1,2)} sub={accuracy.classes.length+' classes'}/>
                    </div>
                    <div className="two-col">
                      <div style={{overflowX:'auto'}}>
                        <div className="chart-title">Confusion matrix (rows = truth, cols = predicted)</div>
                        <table className="mt cm"><thead><tr><th/>{accuracy.classes.map(function(c){return <th key={c} title={c}>{c.substring(0,7)}</th>;})}</tr></thead>
                          <tbody>{accuracy.M.map(function(row,i){var tot=row.reduce(function(a,b){return a+b;},0);return (
                            <tr key={i}><th style={{textAlign:'left'}}>{accuracy.classes[i].substring(0,14)}</th>
                              {row.map(function(v,j){var a=tot?v/tot:0;return <td key={j} style={{background:v?(i===j?'rgba(26,140,78,'+(0.12+a*.5)+')':'rgba(204,34,51,'+(0.08+a*.4)+')'):'transparent',fontWeight:i===j?700:400}}>{v||''}</td>;})}</tr>);})}</tbody></table>
                      </div>
                      <div>
                        <div className="chart-title">Per class</div>
                        <table className="mt"><thead><tr><th>Class</th><th className="num">Precision</th><th className="num">Recall</th><th className="num">F1</th><th className="num">Support</th></tr></thead>
                          <tbody>{accuracy.perClass.map(function(p){return <tr key={p.cls}><td>{p.cls}</td><td className="num">{pct(p.precision)}</td><td className="num">{pct(p.recall)}</td><td className="num">{fmt(p.f1,2)}</td><td className="num">{p.support}</td></tr>;})}</tbody></table>
                        {accuracy.rel && (
                          <div style={{marginTop:10}}>
                            <div className="chart-title">Confidence calibration</div>
                            <table className="mt"><thead><tr><th>Stated conf.</th><th className="num">n</th><th className="num">Mean stated</th><th className="num">Observed acc.</th></tr></thead>
                              <tbody>{accuracy.rel.map(function(r){return <tr key={r.range}><td>{r.range}</td><td className="num">{r.n}</td><td className="num">{r.meanConf!==null?fmt(r.meanConf,0)+'%':'—'}</td><td className="num">{pct(r.acc)}</td></tr>;})}</tbody></table>
                          </div>)}
                      </div>
                    </div>
                  </div>)}
              </div>

              <div className="section">
                <h3>Methods & references</h3>
                <ul className="refs">
                  <li><b>Spectral IP response</b>: Cole &amp; Cole (1941); Pelton et al. (1978), <i>Geophysics</i> 43. Phase-vs-frequency shape discriminates polarisation mechanisms. The app records the deviation-spectrum slope (mrad/decade) as a Cole-Cole shape proxy.</li>
                  <li><b>Organic / hydrocarbon IP</b>: Olhoeft (1985), "Low-frequency electrical properties", <i>Geophysics</i> 50 (USGS pubs 70012963). Clay–organic reactions give a distinctive complex-resistivity response. See also Frontiers in Earth Science (2022) on IP of submarine hydrocarbons.</li>
                  <li><b>Marine towed-streamer IP</b>: Wynn &amp; co-workers (USGS) for heavy minerals (ilmenite), metallic debris/UXO, and oil-in-seawater characterisation.</li>
                  <li><b>Robust background</b>: running median + MAD (Hampel identifier; σ ≈ 1.4826·MAD). This removes drift from water depth, conductivity and temperature without letting targets inflate σ.</li>
                  <li><b>Signature matching</b>: Kruse et al. (1993) spectral angle mapper, weighted by field and lab noise, with lab samples blank-subtracted.</li>
                  <li><b>Layback calibration</b>: reciprocal-line practice from the hydrographic patch test (latency/offset separation), applied along-track to towed sensors.</li>
                  <li><b>Accuracy statistics</b>: Cohen (1960) κ; precision, recall and F1; Wilson score intervals for Pd and accuracy.</li>
                </ul>
              </div>
            </div>)}
        </div>

        <div className="ai-panel">
          <div className="ai-section-title">AI Classifier</div>
          <div>
            <div style={{fontSize:11,color:'var(--dim2)',marginBottom:5}}>Anthropic API key</div>
            <div className="api-key-row"><input className="api-key-input" type="password" placeholder="sk-ant-..." value={apiKey} onChange={function(e){setApiKey(e.target.value);}}/></div>
            <div style={{fontSize:11,color:'var(--dim2)',margin:'6px 0 3px'}}>Model</div>
            <div className="api-key-row"><input className="api-key-input" value={aiModel} onChange={function(e){setAiModel(e.target.value);}}/></div>
            <div style={{fontSize:9,color:'var(--dim)',marginTop:3}}>Key is kept in memory for this session only and sent directly to api.anthropic.com.</div>
          </div>
          <div className="sep" style={{height:1,width:'100%',background:'var(--border)'}}/>
          <div className="ai-section-title">Event Analysis</div>
          {!activeEv && <div style={{fontSize:11,color:'var(--dim)',fontFamily:'var(--font-mono)',padding:'6px 0'}}>Select a row in Analysis tab.</div>}
          {activeEv && (
            <div>
              <div style={{fontSize:10,color:'var(--dim2)',fontFamily:'var(--font-mono)',lineHeight:1.6,marginBottom:8}}>
                Event {(selEv||0)+1} · {activeEv.ts&&activeEv.ts.split(' ')[1]?activeEv.ts.split(' ')[1].substring(0,8):'—'} · {activeEv.nPkts}pkt · SNR {activeEv.maxSNRall.toFixed(1)} (fund {activeEv.maxSNR.toFixed(1)})
                {activeEv.lat!==null && <div>Raw {activeEv.lat.toFixed(6)}, {activeEv.lon.toFixed(6)}</div>}
                {activeEv.latC!==null && proc.applyLayback && <div>Corr {activeEv.latC.toFixed(6)}, {activeEv.lonC.toFixed(6)}</div>}
                <div>COG {activeEv.cog!==null?Math.round(activeEv.cog)+'°':'—'} · SOG {fmt(activeEv.sog,2)} m/s · slope {fmt(activeEv.phaseSlope,1)} mrad/dec</div>
              </div>
              <div className="ai-classification" style={{marginBottom:8}}>
                <div style={{fontSize:10,color:'var(--dim2)',fontFamily:'var(--font-mono)',lineHeight:1.8}}>
                  Rules: <b style={{color:MAT_COLORS[activeEv.cls]}}>{activeEv.cls}</b> ({activeEv.confPct}%)<br/>
                  Fused: <b style={{color:MAT_COLORS[activeEv.fusedCls]}}>{activeEv.fusedCls}</b> ({activeEv.fusedConf}%, {activeEv.fusedSrc}){activeEv.labConflict?<span style={{color:'var(--neg)'}}> ⚠ lab suggests {activeEv.labBest.material}</span>:null}
                </div>
                {activeEv.labMatches.length>0 && (
                  <table className="mt" style={{marginTop:6}}><thead><tr><th>Lab ref</th><th className="num">cos</th><th className="num">angle</th><th className="num">χ²ᵣ</th></tr></thead>
                    <tbody>{activeEv.labMatches.slice(0,4).map(function(m,i){return <tr key={i}><td>{m.material}</td><td className="num">{m.cos.toFixed(3)}</td><td className="num">{m.angleDeg.toFixed(0)}°</td><td className="num">{fmt(m.chi2red,1)}</td></tr>;})}</tbody></table>)}
                {!activeEv.labMatches.length && <div style={{fontSize:10,color:'var(--dim)',marginTop:4}}>No lab references for {af.xmt}Hz — add them in Lab Stats.</div>}
              </div>
              {aiRes && (
                <div className="ai-classification">
                  <div className="ai-cls-row">
                    <div style={{width:10,height:10,borderRadius:2,background:MAT_COLORS[aiRes.classification]||'#333'}}/>
                    <span className="ai-cls-val" style={{color:MAT_COLORS[aiRes.classification]||'var(--text)'}}>{aiRes.classification}</span>
                    <span className="ai-conf-val">{aiRes.confidence_pct}% · {aiRes.confidence_label}</span>
                  </div>
                  {aiRes.key_indicators && <div style={{fontSize:11,color:'var(--accent)',marginBottom:5,fontStyle:'italic'}}>{aiRes.key_indicators}</div>}
                  {aiRes.reasoning && <div style={{fontSize:11,color:'var(--dim3)',lineHeight:1.6,marginBottom:5}}>{aiRes.reasoning}</div>}
                  {aiRes.caution && <div style={{fontSize:10,color:'#b07800',lineHeight:1.5,borderTop:'1px solid var(--border)',paddingTop:5}}>⚠ {aiRes.caution}</div>}
                </div>)}
              <button className="btn btn-ai" style={{width:'100%',marginTop:6}} onClick={function(){doAI(activeIdx,selEv);}} disabled={!apiKey||!!aiLoading}>
                {aiLoading===aiKey?'Analyzing...':aiRes?'↻ Re-run Claude AI':'⚡ Analyze with Claude AI'}</button>
              <div className="sep" style={{height:1,width:'100%',background:'var(--border)',margin:'10px 0'}}/>
              <div className="ai-section-title">Confirm Material (ground truth)</div>
              <div className="confirm-row" style={{marginTop:5}}>
                <select className="confirm-sel" value={confMat} onChange={function(e){setConfMat(e.target.value);}}>
                  <option value="">— material —</option>
                  {CONFIRM_OPTIONS.map(function(m){return <option key={m} value={m}>{m}</option>;})}
                </select>
                <button className="confirm-btn" onClick={function(){saveTraining(activeIdx,selEv);}} disabled={!confMat}>✓</button>
              </div>
              <div style={{fontSize:9,color:'var(--dim)',marginTop:3}}>Use “No anomaly” for false alarms so they count in accuracy.</div>
            </div>)}
          {training.length>0 && (
            <div style={{background:'var(--panel2)',border:'1px solid var(--border2)',borderRadius:3,padding:'6px 9px',fontSize:10,color:'var(--dim3)',fontFamily:'var(--font-mono)',marginTop:8}}>
              {eligibleTraining.length} of {training.length} confirmations used as AI examples<br/>
              <span style={{color:'var(--dim)'}}>policy: {(TRAIN_POLICIES[trainPolicy]||TRAIN_POLICIES.current).label} · change in Metrics</span></div>)}
          {dbNote && <div className="warnbox" style={{marginTop:8,fontSize:10}}>{dbNote}</div>}
        </div>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App,null));

</script>
</body>
</html>
