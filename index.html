<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPA MIP Classifier Portal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap');
:root{
  --bg:#f0f4f8;--panel:#ffffff;--panel2:#f5f8fb;--border:#dde4ed;--border2:#c8d4e0;
  --accent:#0071b8;--accent2:#005a8e;--pos:#1a8c4e;--neg:#cc2233;--warn:#b07800;
  --mixed:#5a50c8;--art:#c05000;--hydro:#0080b0;--metal:#b02040;
  --text:#1a2533;--dim:#8099b0;--dim2:#607a90;--dim3:#3a5570;
  --font-mono:'Space Mono',monospace;--font-ui:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:13px;}
body{overflow:hidden;}
.app{display:grid;grid-template-rows:52px 1fr;height:100vh;}
.topbar{background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;z-index:100;}
.topbar h1{font-family:var(--font-mono);font-size:13px;color:var(--accent);letter-spacing:.08em;white-space:nowrap;}
.sep{width:1px;height:20px;background:var(--border2);}
.main{display:grid;grid-template-columns:260px 1fr 320px;overflow:hidden;}
.sidebar{background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;}
.sidebar>*{flex-shrink:0;}
.content{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
.ai-panel{background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}

/* Sidebar */
.upload-zone{border:1px dashed var(--border2);border-radius:4px;padding:16px 12px;text-align:center;cursor:pointer;transition:border-color .2s;}
.upload-zone:hover,.upload-zone.drag{border-color:var(--accent);}
.upload-zone .icon{font-size:20px;margin-bottom:6px;}
.upload-zone p{font-size:11px;color:var(--dim2);line-height:1.5;}
.upload-zone span{color:var(--accent);}
.file-item{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:3px;cursor:pointer;border:1px solid transparent;transition:all .15s;}
.file-item:hover{background:var(--panel2);}
.file-item.active{background:var(--panel2);border-color:var(--border2);}
.file-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.file-name{font-size:11px;color:var(--dim3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.file-info{font-size:9px;color:var(--dim);font-family:var(--font-mono);}
.sidebar-label{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);padding:0 2px;}
.btn{padding:7px 14px;border-radius:3px;border:none;cursor:pointer;font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;transition:all .15s;white-space:nowrap;}
.btn-primary{background:var(--accent);color:#000;font-weight:700;}
.btn-primary:hover{background:#00a8c8;color:#000;}
.btn-primary:disabled{opacity:.4;cursor:default;}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--dim3);}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-sm{padding:4px 10px;font-size:10px;}
.btn-ai{background:linear-gradient(135deg,#0071b8,#00a8d0);color:#fff;font-weight:700;border:none;}
.btn-ai:hover{opacity:.9;}
.btn-ai:disabled{opacity:.35;cursor:default;}

/* Stats */
.statsbar{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:3px;padding:9px 11px;}
.stat label{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim2);display:block;margin-bottom:3px;}
.stat .val{font-family:var(--font-mono);font-size:15px;font-weight:700;color:var(--accent);}
.stat .sub{font-family:var(--font-mono);font-size:9px;color:var(--dim);margin-top:2px;}

/* Charts */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.chart-panel{background:var(--panel);border:1px solid var(--border);border-radius:3px;padding:10px 12px;}
.chart-panel.full{grid-column:1/-1;}
.chart-title{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim2);margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;}
canvas{display:block;width:100%;}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:5px;}
.li{display:flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:9px;color:var(--dim2);}
.ld{width:14px;height:2px;border-radius:1px;}

/* Events table */
.events-wrap{overflow-x:auto;}
.events-table{width:100%;border-collapse:collapse;min-width:700px;}
.events-table th{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim2);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border2);white-space:nowrap;}
.events-table td{padding:6px 8px;border-bottom:1px solid var(--border);font-family:var(--font-mono);font-size:11px;vertical-align:middle;}
.events-table tr:hover td{background:var(--panel2);}
.events-table tr.selected td{background:var(--panel2);border-bottom-color:var(--border2);}
.badge{display:inline-block;padding:2px 7px;border-radius:2px;font-size:10px;font-weight:700;font-family:var(--font-mono);}
.badge-hydro{background:rgba(0,113,184,.10);color:var(--hydro);}
.badge-metal{background:rgba(176,32,64,.10);color:var(--metal);}
.badge-mixed{background:rgba(90,80,200,.10);color:var(--mixed);}
.badge-art{background:rgba(192,80,0,.10);color:var(--art);}
.badge-weak{background:rgba(80,100,130,.10);color:var(--dim3);}
.conf-bar{display:flex;align-items:center;gap:5px;}
.conf-fill{height:4px;border-radius:2px;min-width:2px;}
.conf-text{font-size:9px;color:var(--dim2);white-space:nowrap;}

/* AI Panel */
.ai-section-title{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim2);}
.api-key-row{display:flex;gap:6px;}
.api-key-input{flex:1;background:var(--panel2);border:1px solid var(--border2);color:var(--text);font-family:var(--font-mono);font-size:11px;padding:6px 9px;border-radius:3px;}
.api-key-input:focus{outline:none;border-color:var(--accent);}
.ai-response{background:var(--panel2);border:1px solid var(--border2);border-radius:3px;padding:10px 12px;flex:1;min-height:120px;}
.ai-response p{font-size:12px;color:var(--dim3);line-height:1.7;white-space:pre-wrap;}
.ai-response .thinking{color:var(--dim);font-style:italic;font-size:11px;}
.ai-classification{background:var(--panel2);border:1px solid var(--border2);border-radius:3px;padding:10px 12px;}
.ai-cls-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.ai-cls-label{font-size:10px;color:var(--dim2);font-family:var(--font-mono);}
.ai-cls-val{font-size:14px;font-weight:600;font-family:var(--font-mono);}
.ai-conf-val{font-family:var(--font-mono);font-size:12px;color:var(--dim3);}
.training-entry{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:2px;background:var(--panel2);font-size:10px;font-family:var(--font-mono);}
.training-entry .mat{font-weight:700;}
.training-list{display:flex;flex-direction:column;gap:3px;max-height:160px;overflow-y:auto;}
.confirm-row{display:flex;gap:6px;align-items:center;}
.confirm-sel{flex:1;background:var(--panel2);border:1px solid var(--border2);color:var(--text);font-family:var(--font-mono);font-size:10px;padding:5px 8px;border-radius:3px;}
.confirm-sel:focus{outline:none;border-color:var(--pos);}
.confirm-btn{background:#1a8c4e;color:#000;border:none;padding:5px 10px;border-radius:3px;font-family:var(--font-mono);font-size:10px;cursor:pointer;font-weight:700;white-space:nowrap;}
.confirm-btn:hover{opacity:.85;}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:280px;color:var(--dim);gap:10px;}
.empty .icon{font-size:32px;opacity:.3;}
.empty p{font-family:var(--font-mono);font-size:11px;text-align:center;line-height:1.7;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:#c0ccd8;border-radius:2px;}
::-webkit-scrollbar-thumb:hover{background:var(--dim);}

/* ── Collections ── */
.coll-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.coll-list{display:flex;flex-direction:column;gap:3px;}
.coll-item{border:1px solid var(--border);border-radius:3px;overflow:hidden;}
.coll-item.active-coll{border-color:var(--accent);}
.coll-title-row{display:flex;align-items:center;gap:6px;padding:6px 8px;cursor:pointer;background:var(--panel2);transition:background .15s;}
.coll-title-row:hover{background:var(--border);}
.coll-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.coll-name{font-size:11px;font-weight:600;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.coll-meta{font-size:9px;color:var(--dim2);font-family:var(--font-mono);white-space:nowrap;}
.coll-files{padding:4px 8px 6px 24px;display:flex;flex-direction:column;gap:2px;background:var(--panel);}
.coll-file-row{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:2px;cursor:pointer;font-size:10px;font-family:var(--font-mono);color:var(--dim3);}
.coll-file-row:hover{background:var(--panel2);color:var(--text);}
.coll-file-row.active{color:var(--accent);font-weight:700;}
.coll-mat-pill{display:inline-block;padding:1px 5px;border-radius:10px;font-size:9px;font-family:var(--font-mono);margin-left:auto;white-space:nowrap;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:999;}
.modal{background:var(--panel);border:1px solid var(--border2);border-radius:6px;padding:24px;width:400px;box-shadow:0 8px 32px rgba(0,0,0,.18);}
.modal h2{font-family:var(--font-mono);font-size:13px;color:var(--accent);margin-bottom:14px;}
.modal label{font-family:var(--font-mono);font-size:10px;color:var(--dim2);display:block;margin-bottom:4px;margin-top:10px;}
.modal input,.modal select{width:100%;background:var(--panel2);border:1px solid var(--border2);color:var(--text);font-family:var(--font-mono);font-size:12px;padding:6px 9px;border-radius:3px;}
.modal input:focus,.modal select:focus{outline:none;border-color:var(--accent);}
.modal .modal-btns{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;}
.color-swatches{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;}
.swatch{width:20px;height:20px;border-radius:3px;cursor:pointer;border:2px solid transparent;transition:border-color .15s;}
.swatch:hover,.swatch.sel{border-color:var(--text);}
.tab-row{display:flex;border-bottom:1px solid var(--border);margin-bottom:10px;}
.tab{padding:6px 14px;font-family:var(--font-mono);font-size:10px;cursor:pointer;color:var(--dim2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;text-transform:uppercase;letter-spacing:.06em;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab:hover:not(.active){color:var(--text);}
.export-box{background:var(--panel2);border:1px solid var(--border);border-radius:3px;padding:10px;font-family:var(--font-mono);font-size:10px;color:var(--dim3);white-space:pre-wrap;max-height:120px;overflow-y:auto;}

/* ── Map panel ── */
.map-panel{background:var(--panel2);border:1px solid var(--border);border-radius:3px;position:relative;overflow:hidden;}
.map-canvas{display:block;width:100%;cursor:crosshair;}
.map-legend{position:absolute;bottom:8px;left:8px;background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:3px;padding:6px 10px;font-family:var(--font-mono);font-size:9px;line-height:1.8;}
.map-controls{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px;}
.map-btn{background:rgba(255,255,255,.9);border:1px solid var(--border2);border-radius:3px;padding:4px 8px;cursor:pointer;font-size:11px;font-family:var(--font-mono);}
.map-btn:hover{background:#fff;border-color:var(--accent);}
.map-tooltip{position:absolute;background:rgba(255,255,255,.97);border:1px solid var(--border2);border-radius:3px;padding:6px 10px;font-family:var(--font-mono);font-size:10px;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.12);max-width:220px;line-height:1.6;}
/* ── Lab output table ── */
.lab-table{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:11px;}
.lab-table th{text-align:right;padding:4px 10px;border-bottom:1px solid var(--border2);font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim2);white-space:nowrap;}
.lab-table th:first-child{text-align:left;}
.lab-table td{text-align:right;padding:4px 10px;border-bottom:1px solid var(--border);color:var(--text);}
.lab-table td:first-child{text-align:left;color:var(--dim3);}
.lab-table tr:hover td{background:var(--panel2);}

/* ── Map & run organizer additions ── */
.map-wrap{position:relative;background:#e8eef4;border-radius:3px;border:1px solid var(--border);overflow:hidden;}
.leaflet-container{border-radius:3px;height:100% !important;}
.map-controls-panel{background:rgba(255,255,255,.95);border:1px solid var(--border2);border-radius:3px;padding:8px 10px;font-family:var(--font-mono);font-size:10px;display:flex;flex-direction:column;gap:6px;}
.layer-btn-group{display:flex;gap:4px;flex-wrap:wrap;}
.layer-btn{padding:3px 8px;border-radius:2px;border:1px solid var(--border2);background:var(--panel);font-family:var(--font-mono);font-size:9px;cursor:pointer;color:var(--dim3);transition:all .15s;}
.layer-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.layer-btn:hover:not(.active){border-color:var(--accent);color:var(--accent);}
.file-sel-list{display:flex;flex-direction:column;gap:3px;max-height:140px;overflow-y:auto;}
.file-sel-row{display:flex;align-items:center;gap:6px;padding:2px 4px;border-radius:2px;cursor:pointer;}
.file-sel-row:hover{background:var(--panel2);}
.file-sel-check{width:12px;height:12px;accent-color:var(--accent);}
.map-canvas{display:block;width:100%;cursor:crosshair;}
.map-tip{position:absolute;background:rgba(255,255,255,.97);border:1px solid var(--border2);border-radius:3px;
  padding:5px 9px;font-family:var(--font-mono);font-size:10px;pointer-events:none;
  box-shadow:0 2px 6px rgba(0,0,0,.12);max-width:200px;line-height:1.55;z-index:20;}
.map-toggles{display:flex;gap:6px;margin-bottom:8px;align-items:center;flex-wrap:wrap;}
.tog{padding:4px 10px;border-radius:3px;border:1px solid var(--border2);background:var(--panel);
  font-family:var(--font-mono);font-size:10px;cursor:pointer;color:var(--dim3);transition:all .15s;}
.tog.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.tog:hover:not(.on){border-color:var(--accent);color:var(--accent);}
.run-group{border:1px solid var(--border);border-radius:3px;overflow:hidden;margin-bottom:6px;}
.run-group-hdr{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel2);
  cursor:pointer;font-family:var(--font-mono);font-size:10px;}
.run-group-hdr:hover{background:var(--border);}
.run-group-name{font-weight:700;color:var(--text);flex:1;}
.run-group-body{padding:4px 6px;display:flex;flex-direction:column;gap:2px;}
.run-entry{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:2px;
  cursor:pointer;font-family:var(--font-mono);font-size:10px;color:var(--dim3);}
.run-entry:hover{background:var(--panel2);color:var(--text);}
.run-entry.active{background:var(--panel2);color:var(--accent);font-weight:700;}
.run-swatch{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.lab-tbl{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:11px;}
.lab-tbl th{text-align:right;padding:4px 10px;border-bottom:1px solid var(--border2);
  font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim2);white-space:nowrap;}
.lab-tbl th:first-child{text-align:left;}
.lab-tbl td{text-align:right;padding:4px 10px;border-bottom:1px solid var(--border);color:var(--text);}
.lab-tbl td:first-child{text-align:left;color:var(--dim3);}
.lab-tbl tr:hover td{background:var(--panel2);}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;
  align-items:center;justify-content:center;z-index:999;}
.modal{background:var(--panel);border:1px solid var(--border2);border-radius:6px;
  padding:22px;width:380px;box-shadow:0 8px 32px rgba(0,0,0,.18);}
.modal h3{font-family:var(--font-mono);font-size:12px;color:var(--accent);margin-bottom:12px;}
.modal label{font-family:var(--font-mono);font-size:10px;color:var(--dim2);display:block;
  margin-top:10px;margin-bottom:3px;}
.modal input,.modal select{width:100%;background:var(--panel2);border:1px solid var(--border2);
  color:var(--text);font-family:var(--font-mono);font-size:12px;padding:6px 8px;border-radius:3px;}
.modal input:focus,.modal select:focus{outline:none;border-color:var(--accent);}
.modal-btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}
.color-row{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap;}
.cswatch{width:20px;height:20px;border-radius:3px;cursor:pointer;border:2px solid transparent;}
.cswatch:hover,.cswatch.sel{border-color:var(--text);}

/* ── v27 additions ── */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:10px;}
.section{background:var(--panel);border:1px solid var(--border);border-radius:3px;padding:12px 14px;margin-bottom:10px;}
.section h3{font-family:var(--font-mono);font-size:11px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.note{font-size:11px;color:var(--dim3);line-height:1.6;margin-bottom:8px;}
.note b{color:var(--text);}
.warnbox{background:rgba(176,120,0,.08);border:1px solid rgba(176,120,0,.3);border-radius:3px;padding:7px 10px;font-size:11px;color:#7a5400;line-height:1.5;margin-bottom:8px;}
.mt{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:10px;}
.mt th{text-align:left;padding:4px 7px;border-bottom:1px solid var(--border2);font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim2);white-space:nowrap;}
.mt td{padding:4px 7px;border-bottom:1px solid var(--border);white-space:nowrap;}
.mt tr:hover td{background:var(--panel2);}
.mt td.num,.mt th.num{text-align:right;}
.cm td{text-align:center;min-width:34px;}
.tier{display:inline-block;padding:1px 6px;border-radius:2px;font-size:9px;font-weight:700;}
.tier-Confirmed{background:rgba(26,140,78,.14);color:var(--pos);}
.tier-Corroborated{background:rgba(0,113,184,.12);color:var(--accent);}
.tier-Conflicting{background:rgba(204,34,51,.12);color:var(--neg);}
.tier-Weak{background:rgba(80,100,130,.12);color:var(--dim3);}
.tier-Single{background:rgba(80,100,130,.08);color:var(--dim2);}
.param-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;}
.param{display:flex;flex-direction:column;gap:2px;}
.param label{font-family:var(--font-mono);font-size:9px;color:var(--dim2);}
.param input,.param select{background:var(--panel2);border:1px solid var(--border2);color:var(--text);font-family:var(--font-mono);font-size:11px;padding:4px 6px;border-radius:3px;width:100%;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.refs li{font-size:11px;color:var(--dim3);line-height:1.6;margin-left:16px;}
.pill{display:inline-block;padding:1px 6px;border-radius:10px;font-size:9px;font-family:var(--font-mono);background:var(--panel2);border:1px solid var(--border2);color:var(--dim3);}

function Num(props){return (
  <div className="param"><label>{props.label}</label>
    <input type="number" step={props.step||1} value={props.value} onChange={function(e){var v=parseFloat(e.target.value);if(isFinite(v))props.onChange(v);}}/></div>);}
function CanvasBox(props){
  var ref=useRef();
  useEffect(function(){props.draw(ref.current);});
  return <canvas ref={ref} style={{height:props.height||180,width:'100%'}} height={props.height||180}/>;
}

// ── App component ──────────────────────────────────────────────────────────────
function App(){
  var [files,setFiles]=useState([]);
  var [activeIdx,setActiveIdx]=useState(null);
  var [training,setTraining]=useState([]);
  var [trainPolicy,setTrainPolicy]=useState(lsGet('ipa_train_policy','current'));
  var [apiKey,setApiKey]=useState('');
  var [aiModel,setAiModel]=useState(lsGet('ipa_ai_model','claude-sonnet-4-5'));
  var [selEv,setSelEv]=useState(null);
  var [aiResults,setAiResults]=useState({});
  var [aiLoading,setAiLoading]=useState(null);
  var [confMat,setConfMat]=useState('');
  var [drag,setDrag]=useState(false);
  var [mainTab,setMainTab]=useState('analysis');
  var [dbStatus,setDbStatus]=useState('loading');
  var [dbNote,setDbNote]=useState('');
  var [authUser,setAuthUser]=useState(null);
  var [proc,setProcState]=useState(function(){var sv=lsGet('ipa_proc',{});return Object.assign({},IPA.DEFAULT_PROC,sv&&sv._v===30?sv:{},{_v:30});});
  var [showProc,setShowProc]=useState(false);
  var [library,setLibrary]=useState([]);
  var [libStatus,setLibStatus]=useState('');
  var [shareState,setShareState]=useState({});   // sha256 -> 'uploading' | 'error:<msg>'
  var [autoShare,setAutoShare]=useState(lsGet('ipa_auto_share',true));
  var [libSel,setLibSel]=useState({});
  var [libFilter,setLibFilter]=useState({kind:'all',text:''});
  var [libBusy,setLibBusy]=useState('');
  var [labSigs,setLabSigs]=useState([]);
  var [labTag,setLabTag]=useState({});
  var [waypoints,setWaypoints]=useState([]);
  var [metricPred,setMetricPred]=useState('fused');
  var [metricLevel,setMetricLevel]=useState('family');
  var [mapFocus,setMapFocus]=useState(null);
  var [customGroups,setCustomGroups]=useState(lsGet('ipa_custom_groups',[]));   // [{id,name}]
  var [groupAssign,setGroupAssign]=useState(lsGet('ipa_group_assign',{}));      // fileKey -> groupId (overrides the day group)
  var [collapsed,setCollapsed]=useState(lsGet('ipa_group_collapsed',{}));
  var [selFiles,setSelFiles]=useState({});                                      // fi -> true (multi-select)
  var [dragOver,setDragOver]=useState(null);
  var [groupNames,setGroupNames]=useState(lsGet('ipa_group_names',{}));
  var [anchorOff,setAnchorOff]=useState(lsGet('ipa_anchor_off',{}));
  var [mapGroup,setMapGroup]=useState('all');
  var [stepIdx,setStepIdx]=useState(-1);
  var [showLines,setShowLines]=useState(true);
  var [showHotspots,setShowHotspots]=useState(true);
  var [showWps,setShowWps]=useState(true);
  var [mapLayer,setMapLayer]=useState('satellite');
  var [visibleFiles,setVisibleFiles]=useState(null);
  var [hiddenHotspots,setHiddenHotspots]=useState({});

  function setProc(patch){setProcState(function(p){var n=Object.assign({},p,patch);lsSet('ipa_proc',n);return n;});}
  useEffect(function(){lsSet('ipa_ai_model',aiModel);},[aiModel]);
  useEffect(function(){lsSet('ipa_group_names',groupNames);},[groupNames]);
  useEffect(function(){lsSet('ipa_custom_groups',customGroups);},[customGroups]);
  useEffect(function(){lsSet('ipa_group_assign',groupAssign);},[groupAssign]);
  useEffect(function(){lsSet('ipa_group_collapsed',collapsed);},[collapsed]);
  useEffect(function(){lsSet('ipa_anchor_off',anchorOff);},[anchorOff]);
  useEffect(function(){lsSet('ipa_train_policy',trainPolicy);},[trainPolicy]);
  // Confirmations allowed to influence NEW classifications (AI few-shot examples, k-NN)
  var eligibleTraining=useMemo(function(){
    var pol=TRAIN_POLICIES[trainPolicy]||TRAIN_POLICIES.current;
    return training.filter(function(t){return t.material&&!t.excluded&&pol.test(t);});
  },[training,trainPolicy]);
  var cohortCounts=useMemo(function(){var c={current:0,legacy:0,excluded:0,ai:0};
    training.forEach(function(t){c[t.cohort]++;if(t.excluded)c.excluded++;if(t.aiUsed)c.ai++;});return c;},[training]);
  function toggleExcluded(rows,val){
    var ids=rows.filter(function(t){return t.id;}).map(function(t){return t.id;});
    setTraining(function(p){return p.map(function(t){return rows.indexOf(t)>=0?Object.assign({},t,{excluded:val}):t;});});
    if(ids.length)setTrainingExcludedDB(ids,val).catch(function(e){setDbNote('Exclusion kept for this session only ('+e.message+'). Run supabase_schema.sql to share it.');});
  }

  var fileRef=useRef(),wpRef=useRef(),mapRef=useRef(),leafletMap=useRef(null),leafletLayers=useRef({});
  var tsRef=useRef(),specRef=useRef(),magRef=useRef(),highRef=useRef();

  // ── Auth ──────────────────────────────────────────────────────────────────
  useEffect(function(){
    supabase.auth.getSession().then(function(res){var s=res.data&&res.data.session;setAuthUser(s&&s.user?s.user:false);});
    var sub=supabase.auth.onAuthStateChange(function(ev,s){setAuthUser(s&&s.user?s.user:false);});
    return function(){if(sub&&sub.data&&sub.data.subscription)sub.data.subscription.unsubscribe();};
  },[]);
  useEffect(function(){
    if(!authUser)return;
    setDbStatus('loading');
    var notes=[];
    Promise.all([
      loadTrainingFromDB().then(function(r){setTraining(r);}),
      loadLabSigsDB().then(function(r){setLabSigs(function(prev){return r.concat(prev.filter(function(s){return s.src!=='db';}));});})
        .catch(function(e){notes.push('lab_signatures: '+e.message);}),
      loadWaypointsDB().then(function(r){if(r.length)setWaypoints(function(prev){return r.concat(prev.filter(function(w){return !w.id;}));});})
        .catch(function(e){notes.push('waypoints: '+e.message);}),
      listLibraryDB().then(function(r){setLibrary(r);}).catch(function(e){notes.push('data_files: '+e.message);})
    ]).then(function(){setDbStatus('ok');setDbNote(notes.length?'Run supabase_schema.sql to enable: '+notes.join('; '):'');})
      .catch(function(e){console.warn('Supabase load failed:',e.message);setDbStatus('error');setDbNote(e.message);});
  },[authUser]);

  // ── Analysis pipeline ─────────────────────────────────────────────────────
  var detKey=DET_KEYS.map(function(k){return proc[k];}).join('|');
  useEffect(function(){setAiResults({});setSelEv(null);},[detKey]);
  var baseAnalyses=useMemo(function(){
    return files.map(function(f){
      if(f.type!=='field'||!f.packets.length)return null;
      try{return IPA.analyzeField(f.packets,proc,labSigs);}catch(e){console.error(e);return null;}
    });
  },[files,detKey,labSigs]);
  var fileAnalyses=useMemo(function(){
    var L=proc.applyLayback?proc.laybackM:0,tau=proc.applyLayback?proc.latencyS:0;
    return baseAnalyses.map(function(fa,fi){return fa?IPA.correctFile(fa,files[fi].packets,L,tau):null;});
  },[baseAnalyses,proc.applyLayback,proc.laybackM,proc.latencyS]);

  function finalCls(fi,ei,ev){var ar=aiResults[fi+'-'+ei];return ar&&ar.classification!=='Error'?ar.classification:ev.fusedCls;}
  function finalConf(fi,ei,ev){var ar=aiResults[fi+'-'+ei];return ar&&ar.classification!=='Error'?ar.confidence_pct:ev.fusedConf;}

  var refLon=useMemo(function(){for(var i=0;i<files.length;i++){var p=files[i].packets.find(function(pk){return pk.lon!==null;});if(p)return p.lon;}return NaN;},[files]);
  var wps=useMemo(function(){return IPA.alignWaypointHemisphere(waypoints,refLon);},[waypoints,refLon]);
  // Known targets: waypoints within targetLinkM merged into one physical target (segment)
  var targets=useMemo(function(){return IPA.buildTargets(wps,proc.targetLinkM);},[wps,proc.targetLinkM]);

  var fieldIdx=useMemo(function(){return fileAnalyses.map(function(fa,fi){return fa?fi:-1;}).filter(function(fi){return fi>=0;});},[fileAnalyses]);
  // Survey day of each line (rank among dates of lines near the targets) + auto groups
  var days=useMemo(function(){return IPA.surveyDays(fieldIdx.map(function(fi){return{fi:fi,run:files[fi].run,packets:files[fi].packets};}),targets);},[fieldIdx,targets]);
  // Groups: one automatic group per survey day + any custom groups. Every field line is in
  // exactly one group: its day group, unless it has been moved (groupAssign, saved per file).
  function fileKey(fi){var f=files[fi];return f?(f.hash||(f.run+'|'+f.name)):'';}
  var dayGroups=useMemo(function(){return IPA.autoGroups(fieldIdx.map(function(fi){return{fi:fi};}),days);},[fieldIdx,days]);
  var allGroups=useMemo(function(){
    var groups=[],byId={},natural={};
    if(proc.autoGroup)dayGroups.forEach(function(g){g.fileIds.forEach(function(fi){natural[fi]=g.id;});
      var x={id:g.id,name:groupNames[g.id]||g.name,auto:true,date:g.date,dayRank:g.dayRank,fileIds:[]};groups.push(x);byId[x.id]=x;});
    else{var u={id:'ungrouped',name:'Ungrouped',auto:true,fileIds:[]};groups.push(u);byId.ungrouped=u;fieldIdx.forEach(function(fi){natural[fi]='ungrouped';});}
    customGroups.forEach(function(c){var x={id:c.id,name:c.name,auto:false,fileIds:[]};groups.push(x);byId[x.id]=x;});
    fieldIdx.forEach(function(fi){var gid=groupAssign[fileKey(fi)];var g=(gid&&byId[gid])||byId[natural[fi]];if(g)g.fileIds.push(fi);});
    return groups.map(function(g,i){return Object.assign(g,{color:GROUP_COLORS[i%GROUP_COLORS.length]});});
  },[dayGroups,customGroups,groupAssign,groupNames,fieldIdx,files,proc.autoGroup]);
  function groupOf(fi){for(var i=0;i<allGroups.length;i++)if(allGroups[i].fileIds.indexOf(fi)>=0)return allGroups[i];return null;}
  function moveFiles(fis,gid){
    if(!fis.length)return;
    if(gid==='__new'){var nm=window.prompt('Name for the new group','Group '+(customGroups.length+1));if(!nm||!nm.trim())return;
      gid='c'+Date.now();var nid=gid;setCustomGroups(function(p){return p.concat([{id:nid,name:nm.trim()}]);});}
    var natural={};dayGroups.forEach(function(g){g.fileIds.forEach(function(fi){natural[fi]=g.id;});});
    setGroupAssign(function(p){var n=Object.assign({},p);fis.forEach(function(fi){var k=fileKey(fi);
      if(proc.autoGroup&&natural[fi]===gid)delete n[k];else n[k]=gid;});return n;});
    setSelFiles({});
  }
  function newGroup(){var nm=window.prompt('Name for the new group','Group '+(customGroups.length+1));if(!nm||!nm.trim())return;
    setCustomGroups(function(p){return p.concat([{id:'c'+Date.now(),name:nm.trim()}]);});}
  function renameGroup(g){var nm=window.prompt('Rename group',g.name);if(!nm||!nm.trim())return;
    if(g.auto)setGroupNames(function(p){var n=Object.assign({},p);n[g.id]=nm.trim();return n;});
    else setCustomGroups(function(p){return p.map(function(x){return x.id===g.id?Object.assign({},x,{name:nm.trim()}):x;});});}
  function deleteCustomGroup(g){
    if(g.fileIds.length&&!window.confirm('Delete "'+g.name+'"? Its '+g.fileIds.length+' line(s) go back to their survey-day group.'))return;
    setCustomGroups(function(p){return p.filter(function(x){return x.id!==g.id;});});
    setGroupAssign(function(p){var n={};Object.keys(p).forEach(function(k){if(p[k]!==g.id)n[k]=p[k];});return n;});
  }
  function resetGroups(){if(!window.confirm('Put every line back in its survey-day group and remove custom groups?'))return;
    setGroupAssign({});setCustomGroups([]);setGroupNames({});}
  function dayRankOf(fi){var d=days.byFile[fi];return d?d.dayRank:0;}

  var fileTracks=useMemo(function(){return fieldIdx.map(function(fi){return{fi:fi,run:files[fi].run,track:fileAnalyses[fi].track,trackLenM:fileAnalyses[fi].trackLenM};});},[fieldIdx,fileAnalyses]);
  var points=useMemo(function(){
    var pts=[];
    fieldIdx.forEach(function(fi){fileAnalyses[fi].events.forEach(function(ev,ei){
      if(ev.latC===null||ev.latC===undefined||ev.isArtifact)return;
      pts.push({lat:ev.latC,lon:ev.lonC,cls:finalCls(fi,ei,ev),conf:finalConf(fi,ei,ev),fi:fi,ei:ei,run:files[fi].run,cog:ev.cog,snr:ev.maxSNRall});
    });});
    return pts;
  },[fieldIdx,fileAnalyses,aiResults]);
  var sites=useMemo(function(){return IPA.buildSites(points,fileTracks,targets,proc);},[points,fileTracks,targets,proc.mergeRadiusM,proc.passRadiusM,proc.detRadiusM]);
  // Layback calibration: automatic line/target anchors in the RAW path frame, user can exclude any
  var anchors=useMemo(function(){
    if(!targets.length)return [];
    return IPA.collectAnchors(fieldIdx.map(function(fi){return{fi:fi,run:files[fi].run,key:files[fi].hash||files[fi].run,packets:files[fi].packets,fa:baseAnalyses[fi],dayRank:dayRankOf(fi)};}),targets,proc);
  },[targets,fieldIdx,baseAnalyses,days,proc.anchorPassM,proc.minLeadM,proc.maxLeadM,proc.minSNRcal,proc.dayFilter]);
  var calib=useMemo(function(){
    if(!targets.length)return null;
    var use=anchors.filter(function(a){return !anchorOff[a.key];}).map(function(a){return Object.assign({},a);});
    var fit=IPA.fitLayback(use);
    fit.excluded=anchors.filter(function(a){return anchorOff[a.key];});
    return fit;
  },[anchors,anchorOff,targets]);
  // Coverage of known targets (corrected positions)
  var coverage=useMemo(function(){
    if(!targets.length||!fieldIdx.length)return null;
    return IPA.evaluateCoverage(fieldIdx.map(function(fi){var fa=fileAnalyses[fi];
      return{fi:fi,run:files[fi].run,dayRank:dayRankOf(fi),track:fa.track,trackLenM:fa.trackLenM,
        events:fa.events.map(function(ev,ei){return Object.assign({},ev,{finalCls:finalCls(fi,ei,ev)});})};}),targets,proc);
  },[targets,fieldIdx,fileAnalyses,days,aiResults,proc.detRadiusM,proc.dayFilter]);

  // Active-file analysis & chart series
  var analysis=useMemo(function(){
    if(activeIdx===null||!files[activeIdx])return null;
    var f=files[activeIdx];
    if(f.type==='lab')return{isLab:true,run:f.run,labStats:IPA.computeLabStats(f.packets),nPkts:f.packets.length};
    var fa=fileAnalyses[activeIdx];if(!fa)return null;
    var pkts=f.packets,harms=fa.harms,bg=fa.bg,T=proc.mode==='legacy'?3:proc.zThresh;
    var ser=function(h){return pkts.map(function(pk){var v=pk.freqs[h];return v?v[0]*1000:NaN;});};
    var d1=ser(harms[0]),dH=ser(harms[5]),d3=ser(harms[2]);
    var mag=pkts.map(function(pk){var v=pk.freqs[harms[0]];return v?v[1]:NaN;});
    var p0=bg.perHz[harms[0]],base0=pkts.map(function(_,i){return IPA.bgAt(bg,harms[0],i);});
    var xL=pkts.map(function(pk){var s=(pk.ts||'').split(' ')[1];return s?s.substring(0,5):'';});
    var im={};pkts.forEach(function(pk,i){im[pk.idx]=i;});
    var bgEv=fa.events.map(function(ev,ei){return{i0:im[ev.pktStart]!==undefined?im[ev.pktStart]:-1,i1:im[ev.pktEnd]!==undefined?im[ev.pktEnd]:-1,
      color:MAT_COLORS[finalCls(activeIdx,ei,ev)]||'#aaa',sel:ei===selEv};});
    return{isLab:false,pkts:pkts,xmt:fa.xmt,harms:harms,bg:bg,clusters:fa.clusters,events:fa.events,d1:d1,mag:mag,dH:dH,d3:d3,xL:xL,bgEv:bgEv,
      hiT:base0.map(function(b){return b+T*p0.std;}),loT:base0.map(function(b){return b-T*p0.std;}),base0:base0,T:T};
  },[files,activeIdx,fileAnalyses,aiResults,selEv,proc.mode,proc.zThresh]);

  useEffect(function(){
    if(!analysis||analysis.isLab||mainTab!=='analysis')return;
    var a=analysis;
    var allPh=a.d1.concat(a.dH).filter(function(v){return isFinite(v)&&Math.abs(v)<200;});
    var phMin=allPh.length?Math.min.apply(null,allPh):-50,phMax=allPh.length?Math.max.apply(null,allPh):50;
    var yr_ph=[Math.floor(phMin/10)*10-5,Math.ceil(phMax/10)*10+5];
    var allMag=a.mag.filter(function(v){return isFinite(v)&&v>0;});
    var yr_mag=[Math.floor((allMag.length?Math.min.apply(null,allMag):0)/100)*100-50,Math.ceil((allMag.length?Math.max.apply(null,allMag):1000)/100)*100+50];
    var ds=[{data:a.d1,color:'#0071b8',width:1.2}];
    var o={xLabels:a.xL,bgEvents:a.bgEv};
    if(a.bg.mode==='robust'){ds.push({data:a.hiT,color:'rgba(176,32,64,.55)',width:1,dash:[5,3]},{data:a.loT,color:'rgba(176,32,64,.55)',width:1,dash:[5,3]},{data:a.base0,color:'#8099b0',width:1,dash:[2,2]});}
    else{o.threshLo=a.bg.mean-3*a.bg.std;o.threshHi=a.bg.mean+3*a.bg.std;}
    drawChart(tsRef.current,ds,yr_ph,o);
    drawChart(highRef.current,[{data:a.d3,color:'#b07800',width:1},{data:a.dH,color:'#1a8c4e',width:1.2}],yr_ph,o);
    drawChart(magRef.current,[{data:a.mag,color:'#1a8c4e',width:1.2}],yr_mag,o);
    var ei=(selEv!==null&&selEv<a.events.length)?selEv:0,ev=a.events[ei];
    if(ev){
      var cls=finalCls(activeIdx,ei,ev),series=[{map:ev.dpDev,color:MAT_COLORS[cls]||'#0071b8'}];
      if(ev.labBest){var sig=labSigs.find(function(s){return s.material===ev.labBest.material&&s.xmt===a.xmt;});
        var blank=labSigs.filter(function(s){return s.material==='Seawater blank'&&s.xmt===a.xmt;}).pop();
        if(sig){var mp={};a.harms.forEach(function(h){var k=sig.freqs.indexOf(h);if(k<0)return;var v=sig.mean[k];
          if(blank){var kb=blank.freqs.indexOf(h);if(kb>=0)v-=blank.mean[kb];}mp[h]=v*ev.labBest.scale;});
          series.push({map:mp,color:MAT_COLORS[sig.material]||'#555',dash:[4,3],width:1.5});}}
      var vals=[];series.forEach(function(s){a.harms.forEach(function(h){if(isFinite(s.map[h]))vals.push(s.map[h]);});});
      drawSpectral(specRef.current,series,a.harms,[Math.floor(Math.min(-5,Math.min.apply(null,vals))/10)*10-5,Math.ceil(Math.max(5,Math.max.apply(null,vals))/10)*10+5]);
    }
  },[analysis,selEv,aiResults,mainTab,labSigs]);

  // ── Leaflet map ───────────────────────────────────────────────────────────
  useEffect(function(){
    if(mainTab!=='map'||!mapRef.current)return;
    var TILES={satellite:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      street:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      topo:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
      noaa:'https://tileservice.charts.noaa.gov/tiles/50000_1/{z}/{x}/{y}.png'};
    var ATTRIBS={satellite:'Tiles &copy; Esri',street:'&copy; OpenStreetMap contributors',topo:'Tiles &copy; Esri',noaa:'NOAA ENC'};
    if(!leafletMap.current||leafletMap.current._container!==mapRef.current){
      if(leafletMap.current){try{leafletMap.current.remove();}catch(e){}}
      var m=L.map(mapRef.current,{center:[47.62,-122.50],zoom:14});
      leafletMap.current=m;
      leafletLayers.current={baseTile:null,tracks:L.layerGroup().addTo(m),hotspots:L.layerGroup().addTo(m),wps:L.layerGroup().addTo(m)};
    }
    setTimeout(function(){if(leafletMap.current)leafletMap.current.invalidateSize();},100);
    var map=leafletMap.current,LL=leafletLayers.current;
    if(LL.baseTile)map.removeLayer(LL.baseTile);
    LL.baseTile=L.tileLayer(TILES[mapLayer],{attribution:ATTRIBS[mapLayer],maxZoom:20}).addTo(map);LL.baseTile.bringToBack();
    LL.tracks.clearLayers();LL.hotspots.clearLayers();LL.wps.clearLayers();
    var bounds=[];
    if(showLines){
      files.forEach(function(f,fi){
        if(f.type!=='field'||(visibleFiles&&visibleFiles.indexOf(fi)<0))return;
        var fa=fileAnalyses[fi];if(!fa||!fa.track.length)return;
        var lls=fa.track.map(function(tp){return[tp.lat,tp.lon];});
        lls.forEach(function(ll){bounds.push(ll);});
        var gg=groupOf(fi),col=gg?gg.color:RUN_COLORS[fi%RUN_COLORS.length];
        var isA=fi===activeIdx;
        var pl=L.polyline(lls,{color:col,weight:isA?4:2.5,opacity:isA?1:.7});
        L.circleMarker(lls[0],{radius:5,fillColor:col,color:'#fff',weight:1.5,fillOpacity:1}).addTo(LL.tracks);
        pl.on('click',function(){setActiveIdx(fi);setMainTab('analysis');setSelEv(null);});
        pl.bindTooltip('<div style="font-family:monospace;font-size:11px"><b>'+f.run+'</b>'+(gg?'<br>'+gg.name:'')+'<br>'+f.packets.length+' pkts · '+f.xmt+'Hz'+
          (proc.applyLayback&&(proc.laybackM||proc.latencyS)?'<br>sensor track (layback '+fmt(proc.laybackM)+' m)':'')+'</div>',{sticky:true});
        pl.addTo(LL.tracks);
      });
    }
    if(showHotspots){
      sites.forEach(function(s){
        var key=s.lat.toFixed(5)+','+s.lon.toFixed(5);if(hiddenHotspots[key])return;
        if(visibleFiles&&!Object.keys(s.runs).some(function(fi){return visibleFiles.indexOf(+fi)>=0;}))return;
        var col=MAT_COLORS[s.cls]||'#808080',multi=s.nRuns>1;
        bounds.push([s.lat,s.lon]);
        var c=L.circle([s.lat,s.lon],{radius:Math.max(proc.mergeRadiusM/2,s.scatterM*2,4),color:col,weight:s.tier==='Confirmed'?3:multi?2:1.2,
          opacity:multi?.95:.6,fillColor:col,fillOpacity:.18,dashArray:multi?null:'6,4'});
        c.bindTooltip('<div style="font-family:monospace;font-size:11px"><b style="color:'+col+'">'+s.cls+'</b> · '+s.tier+'<br>'+
          s.nDet+' det · '+s.nRuns+'/'+s.nPass+' runs ('+pct(s.repeatability)+')'+(s.reciprocal?' · reciprocal':'')+'<br>'+
          'consensus '+pct(s.consensus)+' · scatter '+fmt(s.scatterM)+' m'+(s.nearestWp?'<br>'+s.nearestWp+' @ '+fmt(s.nearestWpM)+' m':'')+'</div>',{sticky:true});
        c.addTo(LL.hotspots);
        L.marker([s.lat,s.lon],{interactive:false,icon:L.divIcon({className:'',iconSize:[120,16],iconAnchor:[60,-12],

    if(showWps){
      var covBy={};if(coverage)coverage.perTarget.forEach(function(t){covBy[t.id]=t;});

        var cv=covBy[T.id],col=!cv||!cv.passes?'#8a94a6':cv.hits===cv.passes?'#1a8c4e':cv.hits?'#c77d0a':'#cc2233';

          .bindTooltip('<div style="font-family:monospace;font-size:11px"><b>Target '+T.label+'</b>'+(T.day?' · day '+T.day:'')+(T.material?'<br>'+T.material:'')+

            (cv?'<br>'+cv.hits+'/'+cv.passes+' passes detected':'')+'</div>',{sticky:true});
        L.marker([T.lat,T.lon],{interactive:false,icon:L.divIcon({className:'',iconSize:[80,14],iconAnchor:[40,24],
          html:'<div style="font-family:monospace;font-size:10px;font-weight:bold;color:'+col+';text-align:center;text-shadow:0 0 3px #fff,0 0 3px #fff">▲ '+T.label+'</div>'})}).addTo(LL.wps);

  },[mainTab,files,fileAnalyses,activeIdx,allGroups,showLines,showHotspots,showWps,visibleFiles,hiddenHotspots,sites,wps,targets,coverage,mapLayer,mapFocus]);

  // ── File loading (IPA packets, or waypoint CSV/GPX) ───────────────────────
  useEffect(function(){lsSet('ipa_auto_share',autoShare);},[autoShare]);
  var libraryHashes=useMemo(function(){var m={};library.forEach(function(r){m[r.sha256]=r;});return m;},[library]);
  var userEmail=authUser&&(authUser.email||(authUser.user_metadata&&authUser.user_metadata.user_name))||null;
  function parseText(name,text,hash,forceWp){
    var pkts=forceWp?[]:IPA.parseAnyFile(text);
    if(pkts.length)return{kind:'ipa',f:{name:name,run:pkts[0].run||name,packets:pkts,xmt:pkts[0].xmt,type:pkts[0].type,text:text,hash:hash},
      rec:{name:name,text:text,hash:hash,kind:pkts[0].type,meta:fileMeta(pkts[0].type,pkts)}};
    var w=IPA.parseWaypoints(text,name);
    if(w.length)return{kind:'wp',w:w,rec:{name:name,text:text,hash:hash,kind:'waypoints',meta:fileMeta('waypoints',null,w)}};
    return null;
  }
  function addParsed(res,noCache){
    if(!noCache){var now=Date.now();idbSaveFiles(res.filter(function(r){return r&&r.rec&&r.rec.hash;}).map(function(r,k){return{hash:r.rec.hash,name:r.rec.name,text:r.rec.text,kind:r.rec.kind,at:now+k};}));}
    var nf=res.filter(function(r){return r&&r.kind==='ipa';}).map(function(r){return r.f;});
    var nw=[];res.forEach(function(r){if(r&&r.kind==='wp')nw=nw.concat(r.w);});
    if(nf.length)setFiles(function(prev){
      var have={};prev.forEach(function(f){if(f.hash)have[f.hash]=1;});
      var add=nf.filter(function(f){if(f.hash&&have[f.hash])return false;if(f.hash)have[f.hash]=1;return true;});
      var u=prev.concat(add);if(!prev.length&&u.length)setActiveIdx(0);return u;});
    if(nw.length)setWaypoints(function(prev){return prev.concat(nw.filter(function(w){return !prev.some(function(p){return sameWaypoint(p,w);});}));});
    return nw;
  }
  // Restore this browser's last session once signed in
  var restoredRef=useRef(false);
  useEffect(function(){
    if(!authUser||restoredRef.current)return;restoredRef.current=true;
    idbLoadFiles().then(function(recs){
      if(!recs||!recs.length)return;
      recs.sort(function(a,b){return (a.at||0)-(b.at||0);});
      addParsed(recs.map(function(r){return parseText(r.name,r.text,r.hash,r.kind==='waypoints');}),true);
      setLibStatus('Restored '+recs.length+' file(s) from this browser\'s last session.');
    });
  },[authUser]);
  function shareRecords(recs){
    var todo=recs.filter(function(r){return r&&r.hash&&!libraryHashes[r.hash]&&shareState[r.hash]!=='uploading';});
    if(!todo.length)return Promise.resolve(0);
    setShareState(function(p){var n=Object.assign({},p);todo.forEach(function(r){n[r.hash]='uploading';});return n;});
    var done=0;
    return todo.reduce(function(chain,r){return chain.then(function(){
      return uploadToLibrary(r,userEmail).then(function(row){
        done++;if(row)setLibrary(function(p){return [row].concat(p);});
        setShareState(function(p){var n=Object.assign({},p);delete n[r.hash];return n;});
      }).catch(function(e){setShareState(function(p){var n=Object.assign({},p);n[r.hash]='error:'+e.message;return n;});});
    });},Promise.resolve()).then(function(){
      listLibraryDB().then(setLibrary).catch(function(){});return done;});
  }
  function shareWaypointsNow(list){
    var loc=list.filter(function(w){return !w.id;});if(!loc.length)return;
    saveWaypointsDB(IPA.alignWaypointHemisphere(loc,refLon)).then(function(d){
      setWaypoints(function(p){return p.filter(function(w){return w.id||!loc.some(function(l){return sameWaypoint(l,w);});})
        .concat(d.map(function(r){return{id:r.id,name:r.name,lat:r.lat,lon:r.lon,material:r.material,source:r.source};}));});
    }).catch(function(e){setDbNote('Waypoints kept locally ('+e.message+').');});
  }
  // KMZ = zipped KML; everything else is read as text
  function readFileText(file){
    if(!/\.kmz$/i.test(file.name))return file.text();
    if(typeof JSZip==='undefined')return Promise.reject(new Error('JSZip not loaded'));
    return file.arrayBuffer().then(function(buf){return JSZip.loadAsync(buf);}).then(function(zip){
      var names=Object.keys(zip.files).filter(function(n){return /\.kml$/i.test(n)&&!zip.files[n].dir;})
        .sort(function(a,b){return (/doc\.kml$/i.test(b)?1:0)-(/doc\.kml$/i.test(a)?1:0)||a.split('/').length-b.split('/').length;});
      return names.length?zip.files[names[0]].async('string'):'';
    });
  }
  var loadFiles=function(fileList,forceWp){
    var arr=Array.prototype.slice.call(fileList);
    Promise.all(arr.map(function(file){return readFileText(file).then(function(text){
      return sha256Hex(text).then(function(h){return parseText(file.name,text,h,forceWp);});
    });})).then(function(res){
      var nw=addParsed(res);
      var bad=res.filter(function(r){return !r;}).length;
      if(bad)alert(bad+' file(s) could not be parsed as IPA packets or waypoints.');
      if(autoShare&&authUser){
        shareRecords(res.filter(Boolean).map(function(r){return r.rec;}));
        if(nw.length)shareWaypointsNow(nw);
      }
    });
  };
  function shareAllLoaded(){
    var recs=files.filter(function(f){return f.hash&&f.text;}).map(function(f){return{name:f.name,text:f.text,hash:f.hash,kind:f.type,meta:fileMeta(f.type,f.packets)};});
    setLibBusy('Uploading…');
    shareRecords(recs).then(function(n){setLibBusy('');setLibStatus(n+' file(s) added to the shared library.');});
    shareWaypointsNow(waypoints);
  }
  function loadFromLibrary(rows){
    var have={};files.forEach(function(f){if(f.hash)have[f.hash]=1;});
    var todo=rows.filter(function(r){return !have[r.sha256];});
    if(!todo.length){setLibStatus('Those files are already loaded.');return;}
    setLibBusy('Downloading '+todo.length+' file(s)…');
    var out=[],errs=0;
    todo.reduce(function(chain,r){return chain.then(function(){
      return downloadFromLibrary(r.storage_path).then(function(text){out.push(parseText(r.file_name,text,r.sha256,r.file_kind==='waypoints'));})
        .catch(function(){errs++;});});},Promise.resolve())
    .then(function(){addParsed(out);setLibBusy('');setLibSel({});
      setLibStatus('Loaded '+out.filter(Boolean).length+' file(s)'+(errs?' · '+errs+' failed':'')+'.');});
  }
  function removeFromLibrary(rows){
    if(!rows.length)return;

    deleteFromLibrary(rows).then(function(){setLibrary(function(p){return p.filter(function(r){return rows.indexOf(r)<0;});});setLibSel({});setLibBusy('');setLibStatus('Deleted '+rows.length+' file(s).');})
      .catch(function(e){setLibBusy('');setLibStatus('Delete failed: '+e.message);});
  }

  // ── AI classification ─────────────────────────────────────────────────────
  function runAI(fi,ei){
    var fa=fileAnalyses[fi];if(!fa||!fa.events[ei])return Promise.resolve();

      setAiResults(function(p){var n=Object.assign({},p);n[key]=r;return n;});
    }).catch(function(e){
      setAiResults(function(p){var n=Object.assign({},p);n[key]={classification:'Error',confidence_pct:0,confidence_label:'Error',key_indicators:'',reasoning:e.message,caution:null};return n;});
    }).finally(function(){setAiLoading(null);});
  }
  var doAI=function(fi,ei){if(!apiKey){alert('Enter API key');return;}runAI(fi,ei).then(function(){setSelEv(ei);});};

  };

  // ── Training confirmations ────────────────────────────────────────────────
  var saveTraining=function(fi,ei){
    if(!confMat)return;
    var fa=fileAnalyses[fi];if(!fa||!fa.events[ei])return;
    var ev=fa.events[ei],harms=fa.harms,ar=aiResults[fi+'-'+ei];
    var entry={material:confMat,run:files[fi].run,ts:ev.ts,
      fv:{dp1:ev.dpDev[harms[0]]||0,dp3:ev.dpDev[harms[2]]||0,dp_last:ev.dpDev[harms[5]]||0,magPct:ev.magPct,maxSNR:ev.maxSNRall,slope:ev.phaseSlope},
      aiConf:ar?ar.confidence_pct:null,rulesCls:ev.cls,aiCls:ar&&ar.classification!=='Error'?ar.classification:null,
      labCls:ev.labBest?ev.labBest.material:null,labCos:ev.labBest?ev.labBest.cos:null,fusedCls:ev.fusedCls,predConf:ev.fusedConf,
      dpDev:ev.dpDev,lat:ev.latC,lon:ev.lonC,cog:ev.cog,sog:ev.sog,procMode:proc.mode,
      cohort:'current',featureBasis:'deviation',aiUsed:!!(ar&&ar.classification!=='Error'),excluded:false};
    setTraining(function(p){return p.concat([entry]);});

      setDbStatus('ok');if(!res.extended)setDbNote('Saved without prediction columns — run supabase_schema.sql so accuracy metrics persist.');
    }).catch(function(e){console.warn('Supabase save failed:',e.message);setDbStatus('error');setDbNote(e.message);});
  };

  // ── Lab signatures ────────────────────────────────────────────────────────
  function addLabSig(grp,material,run){
    var s=IPA.labSignatureFromGroup(grp,material,run);s.src='local';
    setLabSigs(function(p){return p.concat([s]);});
    saveLabSigDB(s).then(function(d){if(d&&d[0])setLabSigs(function(p){return p.map(function(x){return x===s?Object.assign({},x,{id:d[0].id,src:'db'}):x;});});})
      .catch(function(e){setDbNote('Lab signature kept for this session only ('+e.message+'). Run supabase_schema.sql to share it.');});
  }
  function removeLabSig(s){setLabSigs(function(p){return p.filter(function(x){return x!==s;});});if(s.id)deleteLabSigDB(s.id).catch(function(){});}

  // Run group helpers

  // ── Classifier accuracy data ──────────────────────────────────────────────
  var accuracy=useMemo(function(){
    var rows=training.filter(function(t){return t.material&&!t.excluded;}),pred,conf;
    if(metricPred==='knn'){rows=eligibleTraining;var k=IPA.looKnn(rows,3);if(!k)return{n:0,rows:rows.length};pred=k;conf=null;}
    else{
      var fld={fused:'fusedCls',rules:'rulesCls',ai:'aiCls',lab:'labCls'}[metricPred];
      var cf={fused:'predConf',ai:'aiConf'}[metricPred];
      rows=rows.filter(function(t){return t[fld];});
      pred=rows.map(function(t){return t[fld];});conf=cf?rows.map(function(t){return t[cf];}):null;

  },[training,eligibleTraining,metricPred,metricLevel]);

  // Derived render values
  var af=analysis;

  var aiKey=(activeIdx!==null&&selEv!==null)?activeIdx+'-'+selEv:null;
  var aiRes=aiKey?aiResults[aiKey]:null;

  if(authUser===null){
    return <div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--font-mono)'}}><div style={{color:'var(--dim2)',fontSize:12}}>Checking session...</div></div>;
  }
  if(authUser===false){
    return (
      <div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)',fontFamily:'var(--font-mono)'}}>

          <div style={{fontSize:11,color:'var(--dim2)',marginBottom:6}}>WaTech-MatChar-r7 · {APP_VERSION}</div>

            padding:'11px 22px',cursor:'pointer',fontSize:12,fontFamily:'var(--font-mono)',fontWeight:700,letterSpacing:'.04em'}}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.020-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
            Sign in with GitHub

        </div>

  }

  var nField=files.filter(function(f){return f.type==='field';}).length;
  var tiersCount={};sites.forEach(function(s){tiersCount[s.tier]=(tiersCount[s.tier]||0)+1;});
  var multi=sites.filter(function(s){return s.tier!=='Single run'&&s.tier!=='Weak repeat';});
  var tierCls=function(t){return 'tier tier-'+t.split(' ')[0];};

  return (
    <div className="app">

        <div className="sep"/>
        <span title={cohortCounts.legacy+' legacy (v26) confirmations are kept but not used for new classifications under the current policy'} style={{fontFamily:'var(--font-mono)',fontSize:11,color:eligibleTraining.length?'var(--pos)':'var(--dim2)'}}>{eligibleTraining.length}/{training.length} training in use</span>
        <div className="sep"/>
        <span style={{fontFamily:'var(--font-mono)',fontSize:10,color:proc.mode==='legacy'?'#b07800':'var(--dim2)'}}>{proc.mode==='legacy'?'LEGACY v26 detection':'robust detection'}{proc.applyLayback&&(proc.laybackM||proc.latencyS)?' · layback '+fmt(proc.laybackM)+' m':''}</span>
        <div style={{flex:1}}/>
        <span title={dbNote} style={{fontFamily:'var(--font-mono)',fontSize:10,cursor:dbNote?'help':'default',
          color:dbStatus==='ok'?(dbNote?'#b07800':'var(--pos)'):dbStatus==='error'?'var(--neg)':'#b07800'}}>
          {dbStatus==='loading'?'⟳ syncing':dbStatus==='ok'?(dbNote?'⚠ DB partial':'✓ DB synced'):'✗ DB offline'}
        </span>
        <div className="sep"/>
        <span style={{fontFamily:'var(--font-mono)',fontSize:10,color:'var(--dim)'}}>WaTech-MatChar-r7 · {APP_VERSION} · {BUILD_LABEL}</span>

                    style={{width:22,flexShrink:0,background:'var(--panel2)',border:'1px solid var(--border2)',borderRadius:2,fontSize:10,color:'var(--dim2)',cursor:'pointer'}}>
                    {allGroups.map(function(x){return <option key={x.id} value={x.id}>{x.name}</option>;})}
                    <option value="__new">＋ New group…</option>
                  </select>}
                </div>);
            }
            var labIdx=files.map(function(f,i){return f.type==='lab'?i:-1;}).filter(function(i){return i>=0;});
            return (
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              {fieldIdx.length>0 && (
                <div style={{display:'flex',alignItems:'center',gap:6,marginTop:2}}>
                  <span className="sidebar-label" style={{flex:1}}>Lines by group</span>
                  <label title="Group lines automatically by survey date" style={{fontSize:9,fontFamily:'var(--font-mono)',color:'var(--dim2)',display:'flex',alignItems:'center',gap:3}}>
                    <input type="checkbox" checked={!!proc.autoGroup} onChange={function(e){setProc({autoGroup:e.target.checked});}}/>by day</label>
                  <button className="btn btn-primary btn-sm" style={{padding:'3px 7px'}} onClick={newGroup}>+ Group</button>
                </div>)}
              {fieldIdx.length>0 && <div style={{fontSize:9,color:'var(--dim)',fontFamily:'var(--font-mono)',lineHeight:1.4}}>Drag lines onto a group, or use the ▾ menu on a line. Tick several to move them together.</div>}
              {selList.length>0 && (
                <div className="row" style={{gap:4,background:'var(--panel2)',border:'1px solid var(--border2)',borderRadius:3,padding:'5px 6px'}}>
                  <span style={{fontSize:10,fontFamily:'var(--font-mono)'}}>{selList.length} selected →</span>
                  <select className="confirm-sel" style={{flex:1,fontSize:10,padding:'2px 4px'}} value="" onChange={function(e){if(e.target.value)moveFiles(selList,e.target.value);}}>
                    <option value="">Move to…</option>
                    {allGroups.map(function(x){return <option key={x.id} value={x.id}>{x.name}</option>;})}
                    <option value="__new">＋ New group…</option>
                  </select>
                  <button className="btn btn-ghost btn-sm" style={{padding:'2px 6px'}} onClick={function(){setSelFiles({});}}>✕</button>
                </div>)}
              {allGroups.map(function(g){
                var isCol=!!collapsed[g.id],isOver=dragOver===g.id;

                  <div key={g.id} className="run-group" style={isOver?{borderColor:'var(--accent)',boxShadow:'0 0 0 2px rgba(0,113,184,.25)'}:null}
